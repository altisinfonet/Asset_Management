# Trivy exceptions for the runtime image scan (M1-CI-03). Used via `trivy image --ignorefile`.
# The scan already ignores unfixed vulnerabilities (--ignore-unfixed): only an entry for a vulnerability
# that HAS a fixed version belongs here (for example while a base-image update is still in review).
# Every entry needs `statement` (why it is acceptable) and `expired_at` (at most 90 days out); Trivy
# stops honouring an entry after its date, so an expired exception fails the build again by itself.
# Changes need CODEOWNERS review. See docs/engineering/ci.md.
#
