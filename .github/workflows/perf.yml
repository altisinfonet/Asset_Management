# Nightly performance budget job (M1-CI-05). Budgets: scripts/ci/perf-budgets.json (documented in
# docs/engineering/ci.md). Not a required check on PRs; a red nightly run is a defect to triage next morning.
# The registry budgets (asset list, search, tag lookup on 2 x 50,000 assets) are ENFORCED: a registry endpoint
# that cannot be measured fails the run. Set the repository variable PERF_REQUIRE_REGISTRY to 0 to skip them.
name: Performance

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds of load per endpoint
        default: '10'
      connections:
        description: Concurrent connections
        default: '10'

concurrency:
  group: perf
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: assettracker-api:ci
  COMPOSE_PROJECT: ci-perf

jobs:
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - name: Build api image (runtime target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.API_IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Brings the whole stack up (demo seed on), waits for /readyz and leaves it running.
      - name: Start the Compose stack
        env:
          BUILD_IMAGE: '0'
          KEEP_STACK: '1'
        run: scripts/ci/compose-smoke.sh

      # M1-CI-05: 2 x 50,000 assets (Acme and Globex), one INSERT .. SELECT per tenant, then VACUUM ANALYZE.
      - name: Seed 2 x 50,000 assets
        run: scripts/ci/perf-seed.sh

      - name: Measure budgets
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
          PERF_DURATION: ${{ inputs.duration || '10' }}
          PERF_CONNECTIONS: ${{ inputs.connections || '10' }}
          PERF_REQUIRE_REGISTRY: ${{ vars.PERF_REQUIRE_REGISTRY || '1' }}
          PERF_OUT: perf-results.json
        run: node scripts/ci/perf-check.mjs

      # The registry, custody, global search and import suites of the API (apps/api/test/perf) against the
      # same stack (Postgres 5433, PgBouncer 6432 as published by docker-compose.yml). PERF=1 turns on the
      # real budgets there: in the ordinary e2e run (ci.yml api-e2e) the same tests only record their numbers
      # and assert a generous sanity ceiling, because that job shares its machine with other test files.
      - uses: ./.github/actions/setup
        with:
          filter: '@assettracker/api...'

      - run: pnpm --filter "@assettracker/api..." run build

      # M2-OPS-01: also the 500-label PDF (labels-perf), the location-scoped list / search / lookups of a
      # scoped user (ED-26) and scan resolve (registry-perf); each suite writes apps/api/test-results/*.json.
      - name: Registry, custody, scan, scoped access, labels and import budgets (vitest, PERF=1)
        env:
          PERF: '1'
          IMPORT_PERF_ROWS: '100000'
          ISOLATION_MODE: direct
          DATABASE_URL: postgres://app_user:dev@localhost:5433/app
          MIGRATOR_DATABASE_URL: postgres://app_owner:dev@localhost:5433/app
          ADMIN_DATABASE_URL: postgres://postgres:dev@localhost:5433/app
          JOBS_SCHEMA: pgboss_e2e
        run: pnpm --filter @assettracker/api test:e2e test/perf

      - name: Summarise the in-process budgets
        if: always()
        run: node scripts/ci/perf-summary.mjs apps/api/test-results

      # The trend is the series of these artifacts (one JSON per night, 90 days) plus the job summary table.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results-${{ github.run_id }}
          path: |
            perf-results.json
            apps/api/test-results/*.json
            apps/api/test-results/*.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker/compose.ci.yml -p "$COMPOSE_PROJECT" down -v --remove-orphans
