# Local development stack. DUMMY credentials only; real secrets never go in this file.
#   docker compose up -d --build          postgres, pgbouncer, mailpit, minio, clamav, migrate, api, worker, scheduler
#   docker compose --profile web up -d    adds the Next.js dev server (http://localhost:3001)
#   docker compose --profile pooling run --rm pgbouncer-check   asserts the PgBouncer profile (SHOW POOLS/CONFIG)
#   docker compose run --rm migrate       apply new migrations
# Host ports are overridable via .env (see .env.example); Postgres defaults to 5433 because 5432
# is commonly taken by a local install.
name: assettracker

x-api-env: &api-env
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Runtime role (non-owner `app_user`) goes THROUGH PgBouncer (transaction pooling).
  DATABASE_URL: postgres://app_user:dev@pgbouncer:6432/app
  # Object storage (M2-FILE-01): MinIO, bucket created on first start. S3_PUBLIC_ENDPOINT is how the
  # BROWSER reaches MinIO (presigned URLs are signed for it); the containers use minio:9000.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
  S3_BUCKET: assettracker-files
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin-dev
  S3_CREATE_BUCKET: 'true'
  # Virus scanning (M2-FILE-02): ClamAV (clamd). Without it uploads stay `pending` unless
  # SCAN_REQUIRED=false (then they are marked clean with a warning event; see docs/getting-started.md).
  CLAMD_HOST: clamav
  CLAMD_PORT: '3310'
  SCAN_REQUIRED: ${SCAN_REQUIRED:-true}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: 'Asset Tracker <no-reply@assettracker.local>'
  # Envelope-encryption master key (SecretBox): a Docker secret FILE, never an env value.
  MASTER_KEY_FILE: /run/secrets/master_key
  # Base of the invitation and password-reset links in mails. Set it in .env to http://<LAN-IP>:3001 to use the
  # app from another device (docs/getting-started.md, "Open the app from another device on your network").
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3001}
  # Session cookie: true = __Host-at_session with Secure (default). false = at_session without Secure so sign-in
  # works over plain HTTP from a LAN address. DEV ONLY: the api refuses false when NODE_ENV=production (ED-30).
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  # Internal ops server (/metrics, and /healthz /readyz on worker and scheduler). Not published.
  OPS_PORT: '9464'

services:
  postgres:
    image: postgres:19
    # max_connections: the e2e suite in DIRECT mode keeps up to six test files with their pools open at once.
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images keep the data directory under /var/lib/postgresql/18/docker, so the
      # volume mounts at the parent (mounting /var/lib/postgresql/data is no longer correct).
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0 # >= 1.26.1 (CVE-2025-12819 fixed in 1.25.1)
    # Config is a mounted file (not env-generated) because it defines the `app_one` pool_size=1 alias
    # used only by the isolation suite's negative control. Settings: transaction pooling,
    # max_prepared_statements=100 (at 0, named prepared statements break), empty server_reset_query,
    # default_pool_size=16 (small on purpose: forces multiplexing, but big enough that one stalled client cannot starve the suite). Migrations bypass the pooler.
    entrypoint: ['pgbouncer', '/etc/pgbouncer/pgbouncer.ini']
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - '${PGBOUNCER_PORT:-6432}:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 5s
      timeout: 3s
      retries: 10

  # `pooling` profile: one-shot assertion of the PgBouncer settings the isolation suite relies on.
  #   docker compose --profile pooling run --rm pgbouncer-check
  pgbouncer-check:
    profiles: ['pooling']
    image: postgres:19
    environment:
      PGPASSWORD: dev
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        Q="psql -h pgbouncer -p 6432 -U pgbouncer_admin -d pgbouncer -At"
        cfg() { $$Q -c 'show config' | grep "^$$1|" | cut -d'|' -f2; }
        echo "pool_mode=$$(cfg pool_mode) max_prepared_statements=$$(cfg max_prepared_statements) default_pool_size=$$(cfg default_pool_size) server_reset_query='$$(cfg server_reset_query)'"
        test "$$(cfg pool_mode)" = transaction
        test "$$(cfg max_prepared_statements)" = 100
        test "$$(cfg default_pool_size)" = 16
        test -z "$$(cfg server_reset_query)"
        echo '--- SHOW DATABASES'; $$Q -c 'show databases'
        $$Q -c 'show databases' | grep -q '^app_one|.*|1|' && echo 'app_one alias has pool_size=1'
        echo '--- SHOW POOLS'; $$Q -c 'show pools'
    depends_on:
      pgbouncer:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
    command: ['migrate']
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Owner role (app_owner), DIRECT to Postgres (never through the pooler: session advisory lock + DDL).
      MIGRATOR_DATABASE_URL: postgres://app_owner:dev@postgres:5432/app
      # Dev only: create the demo tenants Acme and Globex after migrating (refused in production).
      SEED_DEMO_DATA: 'true'
      # The demo seed encrypts the demo TOTP secrets: same master key as the api (a Docker secret file).
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ['api']
    init: true
    environment: *api-env
    secrets: [master_key]
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Background roles: the SAME image as the api (architecture 3: one image, many roles).
  # worker: pg-boss job workers (mail.send, tenant.heartbeat, ...) + the outbox relay.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ['worker']
    init: true
    environment: *api-env
    secrets: [master_key]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck: &ops-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # scheduler: cron producers (singleton-keyed, safe to run two), the pg-boss maintenance instance
  # and owner-only maintenance jobs (partition rotation). It is the only long-running role holding the
  # OWNER credentials, and it connects to Postgres DIRECTLY (never through PgBouncer).
  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ['scheduler']
    init: true
    environment:
      <<: *api-env
      MAINTENANCE_DATABASE_URL: postgres://app_owner:dev@postgres:5432/app
    secrets: [master_key]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck: *ops-healthcheck

  # Optional: Next.js dev server with hot reload. `/v1` is proxied to the api (dev only; the
  # production build is a static export, which cannot use rewrites).
  web:
    profiles: ['web']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_URL: http://api:3000
      # Comma-separated hosts/IPs allowed to load the dev server's assets and HMR (e.g. 192.168.1.101); see next.config.ts
      DEV_ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-}
    ports:
      - '${WEB_PORT:-3001}:3001'
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  minio:
    # The minio/minio image is no longer published to Docker Hub; Chainguard's build is used.
    # Override with MINIO_IMAGE (it needs the `server /data` command and a root-writable /data).
    image: ${MINIO_IMAGE:-chainguard/minio:latest}
    user: '0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

  # ClamAV daemon for upload scanning (M2-FILE-02). ON by default in dev: remove it (and set
  # SCAN_REQUIRED=false) to develop without it. First start downloads the signature database (needs
  # internet, a minute or two); `docker compose ps` shows `healthy` when clamd answers. Needs ~1-2 GB RAM.
  # The signatures live in a named volume, so later starts are fast. Port 3310 is published for the
  # e2e suite (CLAMD_HOST/CLAMD_PORT); the image has no authentication, so never publish it beyond localhost.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    environment:
      # Upload cap is 100 MiB (FILES_MAX_BYTES_CEILING): clamd must accept a stream that large
      # (INSTREAM is limited by StreamMaxLength, the unpacked content by MaxFileSize / MaxScanSize).
      CLAMD_CONF_StreamMaxLength: 105M
      CLAMD_CONF_MaxFileSize: 105M
      CLAMD_CONF_MaxScanSize: 210M
    ports:
      - '127.0.0.1:${CLAMD_PORT:-3310}:3310'
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

# Dummy DEV master key (docker/secrets/master_key.dev). A real install generates its own:
#   openssl rand -base64 32 > master_key && chmod 600 master_key   (and BACK IT UP: without it, encrypted data is lost)
secrets:
  master_key:
    file: ${MASTER_KEY_FILE_PATH:-./docker/secrets/master_key.dev}

volumes:
  pgdata:
  miniodata:
  clamdata:
