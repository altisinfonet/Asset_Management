# Local development stack. DUMMY credentials only; real secrets never go in this file.
#   docker compose up -d --build          postgres, pgbouncer, mailpit, minio, migrate, api
#   docker compose --profile web up -d    adds the Next.js dev server (http://localhost:3001)
#   docker compose run --rm migrate       apply new migrations
# Host ports are overridable via .env (see .env.example); Postgres defaults to 5433 because 5432
# is commonly taken by a local install.
name: assettracker

x-api-env: &api-env
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Runtime role (non-owner `app`) goes THROUGH PgBouncer (transaction pooling).
  DATABASE_URL: postgres://app:dev@pgbouncer:6432/app
  S3_ENDPOINT: http://minio:9000
  SMTP_URL: smtp://mailpit:1025

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images keep the data directory under /var/lib/postgresql/18/docker, so the
      # volume mounts at the parent (mounting /var/lib/postgresql/data is no longer correct).
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0 # >= 1.26.1 (CVE-2025-12819 fixed in 1.25.1)
    environment:
      # Generates pgbouncer.ini + userlist.txt for the `app` role only. Migrations bypass it.
      DATABASE_URL: postgres://app:dev@postgres:5432/app
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: '100' # at 0, named prepared statements break in transaction mode
      DEFAULT_POOL_SIZE: '20'
      MAX_CLIENT_CONN: '200'
    ports:
      - '${PGBOUNCER_PORT:-6432}:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
    command: ['migrate']
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Owner role, DIRECT to Postgres (never through the pooler: session advisory lock + DDL).
      MIGRATOR_DATABASE_URL: postgres://migrator:dev@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_TARGET:-runtime}
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ['api']
    init: true
    environment: *api-env
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Optional: Next.js dev server with hot reload. `/v1` is proxied to the api (dev only; the
  # production build is a static export, which cannot use rewrites).
  web:
    profiles: ['web']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_URL: http://api:3000
    ports:
      - '${WEB_PORT:-3001}:3001'
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  minio:
    # The minio/minio image is no longer published to Docker Hub; Chainguard's build is used.
    # Override with MINIO_IMAGE (it needs the `server /data` command and a root-writable /data).
    image: ${MINIO_IMAGE:-chainguard/minio:latest}
    user: '0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
