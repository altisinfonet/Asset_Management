; PgBouncer for the dev stack and CI (M1-REPO-03). DEV ONLY: dummy credentials (userlist.txt).
; Mirrors the production pooling model the isolation suite validates (docs/validation/spike_rls_pgbouncer.md):
;   transaction pooling, named prepared statements enabled, no reset query (transaction mode never
;   runs one), and a deliberately SMALL pool so clients are multiplexed over few server connections.
; Only the runtime role (app_user) goes through here. Migrations (app_owner) connect DIRECT to Postgres.

[databases]
app     = host=postgres port=5432 dbname=app
; Negative control ONLY (test/isolation/pooling.e2e.test.ts): pool_size=1 makes two clients share one
; server connection deterministically, so a deliberate session-level SET is observed leaking.
; Never point the application at this alias.
app_one = host=postgres port=5432 dbname=app pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

pool_mode = transaction
default_pool_size = 4
max_client_conn = 200
max_prepared_statements = 100
server_reset_query =
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
