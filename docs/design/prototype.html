/* ===== Base ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh-base);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:var(--fs-xl);line-height:var(--lh-xl)}
h2{font-size:var(--fs-lg);line-height:var(--lh-lg)}
a{color:var(--primary-text)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:var(--fs-sm)}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);color:var(--text);padding:8px 12px;border-radius:var(--r-md);z-index:100;border:1px solid var(--border-strong)}
.skip:focus{left:8px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.i.lg{width:20px;height:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 8px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font-weight:600;font-size:var(--fs-md)}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--primary-on);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:36px;border-radius:var(--r-md);color:var(--text);text-decoration:none;position:relative}
.nav a:hover{background:var(--sunken)}
.nav a[aria-current="page"]{background:var(--primary-subtle);color:var(--primary-text);font-weight:500}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--primary)}
.nav .count{margin-left:auto;font-size:var(--fs-xs);background:var(--danger-subtle);color:var(--danger-text);border-radius:var(--r-full);padding:0 6px}
.nav .group{font-size:var(--fs-xs);color:var(--muted);padding:12px 10px 4px;letter-spacing:.04em;text-transform:uppercase}
.main-col{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--border);min-height:52px}
.topbar .crumbs{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanfield{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:0 8px;height:var(--control);width:260px}
.scanfield input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.scanfield:focus-within{outline:2px solid var(--focus);outline-offset:2px}
kbd{font-family:var(--font-mono);font-size:var(--fs-xs);background:var(--sunken);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--muted)}
.banner-proto{background:var(--info-subtle);color:var(--info-text);padding:6px 24px;font-size:var(--fs-sm);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)}
main{flex:1;overflow:auto;padding:24px;max-width:100%}
.page{max-width:var(--content-max);margin:0 auto}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .spacer{flex:1}
.menu-btn{display:none}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control);padding:0 14px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--primary);color:var(--primary-on);border-color:transparent}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{background:var(--danger);color:var(--danger-on);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:var(--control-dense);padding:0 10px;font-size:var(--fs-sm)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.field label,.field .lbl{font-weight:500}
.field .help{color:var(--muted);font-size:var(--fs-sm)}
.input,select.input,textarea.input{height:var(--control);padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);width:100%}
textarea.input{height:auto;padding:8px 10px;min-height:64px}
.input:focus{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:34px;padding:0 14px;cursor:pointer;font-weight:500}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--primary-subtle);color:var(--primary-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:var(--r-full);padding:2px 6px 2px 10px;background:var(--surface);font-size:var(--fs-sm)}
.chip button{border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:50%;width:20px;height:20px}
.chip button:hover{background:var(--sunken)}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:500;line-height:18px;white-space:nowrap}
.b-success{background:var(--success-subtle);color:var(--success-text)}
.b-primary{background:var(--primary-subtle);color:var(--primary-text)}
.b-warning{background:var(--warning-subtle);color:var(--warning-text)}
.b-danger{background:var(--danger-subtle);color:var(--danger-text)}
.b-info{background:var(--info-subtle);color:var(--info-text)}
.b-neutral{background:var(--sunken);color:var(--muted)}

/* ===== Card + Table ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.card.pad{padding:16px}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.toolbar .spacer{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto;overflow-y:hidden}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--primary)}
.tabs button:hover{color:var(--text)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 340px);min-height:120px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-sm)}
th{position:sticky;top:0;background:var(--sunken);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:var(--z-sticky)}
td{padding:8px 12px;border-bottom:1px solid var(--border);height:40px;white-space:nowrap}
tbody tr:hover td{background:var(--sunken)}
tbody tr[aria-selected="true"] td{background:var(--primary-subtle)}
tbody tr{cursor:pointer}
td.chk,th.chk{width:36px;padding-right:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--muted);font-size:var(--fs-sm)}
.bulkbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--primary-subtle);color:var(--primary-text);border-bottom:1px solid var(--border);flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px}
.empty h2{margin-bottom:4px}
.empty p{color:var(--muted);margin:0 0 16px}

/* ===== Detail ===== */
.hero{display:flex;gap:16px;align-items:flex-start;padding:16px;flex-wrap:wrap}
.photo{width:88px;height:88px;border-radius:var(--r-lg);background:var(--sunken);border:1px dashed var(--border-strong);display:grid;place-items:center;color:var(--muted);font-size:var(--fs-xs)}
.hero .info{flex:1;min-width:240px}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;padding:16px}
dl.kv{margin:0;display:grid;grid-template-columns:130px 1fr;gap:8px 12px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:16px}
.timeline li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.timeline .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);margin-top:7px;flex:none}
.timeline time{color:var(--muted);font-size:var(--fs-sm);min-width:130px}

/* ===== Settings ===== */
.settings{display:grid;grid-template-columns:200px 1fr;gap:24px}
.subnav{display:flex;flex-direction:column;gap:2px}
.subnav a{padding:0 10px;min-height:34px;display:flex;align-items:center;border-radius:var(--r-md);color:var(--text);text-decoration:none}
.subnav a:hover{background:var(--sunken)}
.subnav a[aria-current="page"]{background:var(--primary-subtle);color:var(--primary-text);font-weight:500}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:20px}
.tree .row{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 8px;border-radius:var(--r-md)}
.tree .row:hover{background:var(--sunken)}
.tree .row button.tg{border:0;background:transparent;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.tree .row .n{margin-left:auto;color:var(--muted)}
.callout{display:flex;gap:8px;padding:10px 12px;border-radius:var(--r-lg);background:var(--info-subtle);color:var(--info-text);margin-bottom:16px}

/* ===== Dialog / drawer / toast / palette ===== */
dialog{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);color:var(--text);padding:0;box-shadow:var(--shadow-lg);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:color-mix(in srgb,var(--scrim) 55%,transparent)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(480px,100vw);border-radius:var(--r-xl) 0 0 var(--r-xl)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.dlg-body{padding:20px;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface)}
dialog.drawer form{display:flex;flex-direction:column;height:100%}
dialog.drawer .dlg-body{flex:1}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:var(--z-toast)}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-left:4px solid var(--success);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:10px 12px;display:flex;gap:12px;align-items:center;min-width:280px}
.toast.err{border-left-color:var(--danger)}
.pal{padding:0;width:min(560px,calc(100vw - 32px));margin-top:12vh}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:14px 16px;background:transparent;outline:0;font-size:var(--fs-md)}
.pal ul{list-style:none;margin:0;padding:8px;max-height:320px;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;min-height:36px}
.pal li button:hover,.pal li button[aria-selected="true"]{background:var(--primary-subtle);color:var(--primary-text)}
.pal .grp{font-size:var(--fs-xs);color:var(--muted);padding:8px 10px 2px}
.inline-err{color:var(--danger-text);display:flex;gap:6px;align-items:center;margin-top:4px}

@media (max-width: 1023px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);transform:translateX(-100%);z-index:var(--z-drawer);box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  .menu-btn{display:inline-flex}
  .settings{grid-template-columns:1fr}
  .scanfield{width:160px}
}
</style>
</head>

function treeHtml(n, key){
  var id = key+n.n; var isOpen = open[id]===undefined ? (key==='a' && n.n==='Riverside Elementary') : open[id];
  var has = n.k && n.k.length;
  var h = '<li role="treeitem"'+(has?' aria-expanded="'+isOpen+'"':'')+'><div class="row">'+(has?'<button class="tg" data-tog="'+esc(id)+'" aria-label="'+(isOpen?'Collapse':'Expand')+' '+esc(n.n)+'">'+ic(isOpen?'chevD':'chevR')+'</button>':'<span style="width:24px"></span>')+'<span>'+esc(n.n)+'</span><span class="n">'+n.c+'</span></div>';
  if(has && isOpen){ h += '<ul role="group">'+n.k.map(function(c){return treeHtml(c,id+'/');}).join('')+'</ul>'; }
  return h+'</li>';
}
function viewStub(title, text){
  return '<div class="page-head"><h1>'+title+'</h1></div><div class="card"><div class="empty"><h2>Not part of this prototype</h2><p>'+text+' See wireframes.md for the full layout.</p><a class="btn" href="#/assets">Back to assets</a></div></div>';
}

/* ---------- router ---------- */
function render(){
  var hash = location.hash || '#/assets';
  var parts = hash.replace(/^#\//,'').split('/');
  var h='', crumb='';
  if(parts[0]==='assets'){ h=viewAssets(); crumb='Assets'; }
  else if(parts[0]==='asset'){ h=viewDetail(parts[1], parts[2]); crumb='Assets / '+parts[1]; }
  else if(parts[0]==='settings'){ h=viewSettings(parts[1]); crumb='Settings'; }
  else if(parts[0]==='locations'){ h=viewStub('Locations','The locations tree lives under Settings in this prototype.'); crumb='Locations'; }
  else if(parts[0]==='loaner'){ h=viewStub('Loaner pool','Loaner pool: quick check-out, due dates, overdue alerts, bulk check-in.'); crumb='Loaner pool'; }
  else if(parts[0]==='repairs'){ h=viewStub('Repairs','Repair log across all assets.'); crumb='Repairs'; }
  else if(parts[0]==='stocktake'){ h=viewStub('Stocktake','Audit sessions by location with scan-to-confirm and variance report.'); crumb='Stocktake'; }
  else if(parts[0]==='labels'){ h=viewStub('Labels','QR / Code128 PDF sheet preview and download.'); crumb='Labels'; }
  else if(parts[0]==='import'){ h=viewStub('Import','CSV upload, column mapping, dry-run results, import.'); crumb='Import'; }
  else { h=viewStub('Not found','That page does not exist.'); crumb='Not found'; }
  document.getElementById('view').innerHTML = h;
  document.getElementById('crumbs').textContent = crumb;
  renderNav(hash);
  document.body.classList.remove('nav-open');
  document.title = crumb + ' - Asset Tracker prototype';
}
window.addEventListener('hashchange', function(){ render(); var m=document.getElementById('main'); m.scrollTop=0; });

/* ---------- dialogs ---------- */
var lastTrigger = null;
function openDlg(el, html, trigger){
  lastTrigger = trigger || document.activeElement;
  el.innerHTML = html; el.showModal();
  var f = el.querySelector('[autofocus]') || el.querySelector('input,select,button.primary');
  if(f) f.focus();
  el.addEventListener('close', function once(){ el.removeEventListener('close', once); if(lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); });
}
function closeDlg(el){ if(el.open) el.close(); }
function options(list, sel){ return list.map(function(p){return '<option'+(p===sel?' selected':'')+'>'+esc(p)+'</option>';}).join(''); }

function checkoutDialog(tag, mode, trigger){
  var a = byTag(tag); if(!a) return;
  mode = mode || (a.status==='Deployed' ? 'in' : 'out');
  var tabs = '<div class="seg" role="tablist" aria-label="Action"><button type="button" role="tab" data-mode="out" aria-selected="'+(mode==='out')+'">Check out</button><button type="button" role="tab" data-mode="in" aria-selected="'+(mode==='in')+'">Check in</button><button type="button" role="tab" data-mode="transfer" aria-selected="'+(mode==='transfer')+'">Transfer</button></div>';
  var blocked = '';
  if(mode==='out' && a.status==='Deployed') blocked = '<div class="callout" style="background:var(--danger-subtle);color:var(--danger-text)" role="alert">'+ic('alert')+'<span>Already assigned to '+esc(a.who)+'. Check it in first.</span></div>';
  if(mode==='in' && a.status!=='Deployed' && a.status!=='Out for fix') blocked = '<div class="callout" style="background:var(--warning-subtle);color:var(--warning-text)" role="alert">'+ic('alert')+'<span>This asset is not checked out.</span></div>';
  var body = '';
  if(mode==='out' || mode==='transfer'){
    body = '<div class="field"><label for="co-person">'+(mode==='out'?'Check out to':'Transfer to')+' (required)</label><select id="co-person" class="input">'+options(PEOPLE, 'A. Chen')+'</select></div>'+
      '<div class="field"><label for="co-due">Expected return</label><input id="co-due" type="date" class="input" value="2026-12-18"><div class="chips" style="margin-top:4px"><button type="button" class="btn sm" data-due="2026-11-17">Today</button><button type="button" class="btn sm" data-due="2026-11-24">+1 week</button><button type="button" class="btn sm" data-due="2026-12-18">End of term</button></div></div>';
  } else {
    body = '<div class="field"><label for="ci-cond">Condition</label><select id="ci-cond" class="input"><option>Good</option><option>Damaged</option><option>Needs repair</option></select></div>'+
      '<div class="field"><label for="ci-status">Status after check-in</label><select id="ci-status" class="input"><option>Ready</option><option>Out for fix</option></select></div>';
  }
  body += '<div class="field"><label for="co-note">Notes</label><textarea id="co-note" class="input" placeholder="Optional"></textarea></div>';
  var html = '<form method="dialog" id="coForm"><div class="dlg-head"><h2 id="dlgTitle">'+(mode==='out'?'Check out':mode==='in'?'Check in':'Transfer')+' asset</h2><button type="button" class="btn ghost" data-close aria-label="Close dialog">'+ic('x','lg')+'</button></div>'+
    '<div class="dlg-body">'+tabs+'<div style="margin:16px 0;padding:10px 12px;background:var(--sunken);border-radius:var(--r-lg)"><span class="mono"><strong>'+a.tag+'</strong></span> &nbsp;'+esc(a.name)+' '+badge(a)+'</div>'+blocked+body+'</div>'+
    '<div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" '+(blocked?'disabled':'')+'>'+(mode==='out'?'Check out':mode==='in'?'Check in':'Transfer')+'</button></div></form>';
  var d = document.getElementById('dlg');
  openDlg(d, html, trigger);
  d.dataset.tag = tag;
}

function newFieldDrawer(trigger){
  openDlg(document.getElementById('drawer'),
   '<form method="dialog"><div class="dlg-head"><h2 id="drTitle">New custom field</h2><button type="button" class="btn ghost" data-close aria-label="Close">'+ic('x','lg')+'</button></div><div class="dlg-body">'+
   '<div class="field"><label for="f-l">Label (required)</label><input id="f-l" class="input" placeholder="e.g. Screen size" autofocus></div>'+
   '<div class="field"><label for="f-t">Type</label><select id="f-t" class="input"><option>Text</option><option>Number</option><option>Date</option><option>Select</option><option>Multi-select</option><option>Checkbox</option><option>URL</option></select><span class="help">Type cannot change after assets have data.</span></div>'+
   '<fieldset style="border:0;padding:0;margin:0 0 16px"><legend class="lbl" style="font-weight:500;margin-bottom:4px">Applies to categories</legend>'+cats.map(function(c){return '<label style="display:flex;gap:8px;align-items:center;min-height:28px"><input type="checkbox"> '+c[0]+'</label>';}).join('')+'</fieldset>'+
   '<label style="display:flex;gap:8px;align-items:center;min-height:28px"><input type="checkbox"> Required</label><label style="display:flex;gap:8px;align-items:center;min-height:28px"><input type="checkbox" checked> Filterable</label>'+
   '<div class="field" style="margin-top:12px"><label for="f-h">Help text</label><input id="f-h" class="input"></div></div>'+
   '<div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" data-save="field">Save field</button></div></form>', trigger);
}
function simpleDlg(title, bodyHtml, cta, trigger){
  openDlg(document.getElementById('dlg'),'<form method="dialog"><div class="dlg-head"><h2 id="dlgTitle">'+title+'</h2><button type="button" class="btn ghost" data-close aria-label="Close dialog">'+ic('x','lg')+'</button></div><div class="dlg-body">'+bodyHtml+'</div><div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">'+cta+'</button></div></form>', trigger);
}

/* ---------- palette ---------- */
var palItems = [];
function openPalette(){
  var d = document.getElementById('pal'); lastTrigger = document.activeElement;
  d.innerHTML = '<input id="palq" placeholder="Type a command or an asset tag" aria-label="Command palette search" autocomplete="off"><ul id="pall" role="listbox"></ul>';
  d.showModal(); document.getElementById('palq').focus(); palFilter('');
  d.addEventListener('close', function once(){ d.removeEventListener('close', once); if(lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); });
}
var palSel = 0;
function palFilter(q){
  q = q.toLowerCase();
  var all = [['Go to','Assets','#/assets'],['Go to','Settings: Custom fields','#/settings/fields'],['Go to','Settings: Status labels','#/settings/status'],['Go to','Settings: Locations','#/settings/locations'],['Action','New asset','act:newasset'],['Action','Check out an asset','act:quickout'],['Action','Toggle dark mode','act:theme']];
  assets.forEach(function(a){ all.push(['Asset', a.tag+'  '+a.name+'  ('+a.status+')', '#/asset/'+a.tag]); });
  palItems = all.filter(function(i){ return !q || i[1].toLowerCase().indexOf(q)>-1; });
  palItems.sort(function(x,y){ var ex = (x[0]==='Asset' && x[1].toLowerCase().indexOf(q)===0 && q)?0:1, ey=(y[0]==='Asset' && y[1].toLowerCase().indexOf(q)===0 && q)?0:1; return ex-ey; });
  palItems = palItems.slice(0, 9); palSel = 0;
  var last='', h='';
  palItems.forEach(function(i,idx){ if(i[0]!==last){ h+='<li class="grp" role="presentation">'+i[0]+'</li>'; last=i[0]; } h+='<li role="presentation"><button role="option" data-pi="'+idx+'" aria-selected="'+(idx===palSel)+'">'+esc(i[1])+'</button></li>'; });
  if(!palItems.length) h = '<li class="grp">No results</li>';
  document.getElementById('pall').innerHTML = h;
}
function palRun(idx){
  var it = palItems[idx]; if(!it) return;
  closeDlg(document.getElementById('pal'));
  if(it[2].indexOf('act:')===0){
    var a = it[2].slice(4);
    if(a==='theme') toggleTheme();
    else if(a==='newasset') toast('New asset form is in wireframes.md (WEB-06).');
    else if(a==='quickout') go('#/assets');
  } else go(it[2]);
}

/* ---------- theme ---------- */
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); var b=document.getElementById('themeBtn'); b.setAttribute('aria-pressed', t==='dark'); b.textContent = t==='dark' ? 'Light mode' : 'Dark mode'; try{ localStorage.setItem('at-theme', t);}catch(e){} }
function currentTheme(){ var t=document.documentElement.getAttribute('data-theme'); if(t) return t; return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light'; }
function toggleTheme(){ applyTheme(currentTheme()==='dark'?'light':'dark'); }

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target;
  var close = t.closest('[data-close]'); if(close){ var dd = close.closest('dialog'); closeDlg(dd); return; }
  var tog = t.closest('[data-tog]'); if(tog){ var id=tog.getAttribute('data-tog'); var cur = open[id]===undefined ? (id==='aRiverside Elementary') : open[id]; open[id]=!cur; render(); var nb=document.querySelector('[data-tog="'+id.replace(/"/g,'\\"')+'"]'); if(nb) nb.focus(); return; }
  var pi = t.closest('[data-pi]'); if(pi){ palRun(+pi.getAttribute('data-pi')); return; }
  var due = t.closest('[data-due]'); if(due){ document.getElementById('co-due').value = due.getAttribute('data-due'); return; }
  var mode = t.closest('[data-mode]'); if(mode){ var d=document.getElementById('dlg'); var tag=d.dataset.tag; var trg=lastTrigger; checkoutDialog(tag, mode.getAttribute('data-mode'), trg); var nt = d.querySelector('[data-mode="'+mode.getAttribute('data-mode')+'"]'); if(nt) nt.focus(); return; }
  var vw = t.closest('[data-view]'); if(vw){ state.status = vw.getAttribute('data-view'); render(); var nv=document.querySelector('[data-view="'+state.status+'"]'); if(nv) nv.focus(); return; }
  var tb = t.closest('[data-tab]'); if(tb){ var cur2 = location.hash.split('/'); go('#/asset/'+cur2[2]+'/'+tb.getAttribute('data-tab')); var nt2=document.querySelector('[data-tab="'+tb.getAttribute('data-tab')+'"]'); if(nt2) nt2.focus(); return; }
  var act = t.closest('[data-act]');
  if(act){
    var a = act.getAttribute('data-act'), tag = act.getAttribute('data-tag') || (location.hash.split('/')[2]||'');
    if(a==='checkout') checkoutDialog(tag,'out',act);
    else if(a==='checkin') checkoutDialog(tag,'in',act);
    else if(a==='transfer') checkoutDialog(tag,'transfer',act);
    else if(a==='clrstatus'){ state.status=''; render(); }
    else if(a==='clrq'){ state.q=''; render(); }
    else if(a==='clrall'){ state.status=''; state.q=''; render(); }
    else if(a==='clrsel'){ state.sel={}; render(); }
    else if(a==='togcols'){ state.cols=!state.cols; render(); var tc=document.querySelector('[data-act="togcols"]'); if(tc) tc.focus(); }
    else if(a==='newfield') newFieldDrawer(act);
    else if(a==='newcat') simpleDlg('New category','<div class="field"><label for="nc">Name (required)</label><input id="nc" class="input" autofocus></div>','Create category',act);
    else if(a==='newstatus') simpleDlg('New status label','<div class="field"><label for="ns">Label (required)</label><input id="ns" class="input" autofocus></div><div class="field"><label for="nt">State type</label><select id="nt" class="input"><option>Ready</option><option>Assigned</option><option>In repair</option><option>Lost</option><option>Archived/disposed</option></select><span class="help">State type decides behaviour and badge colour.</span></div>','Create label',act);
    else if(a==='newloc') simpleDlg('Add location','<div class="field"><label for="nl">Name (required)</label><input id="nl" class="input" autofocus></div><div class="field"><label for="np">Parent</label><select id="np" class="input"><option>Riverside Elementary</option><option>Main building</option></select></div>','Add location',act);
    else if(a==='newasset') toast('Asset create/edit form is in wireframes.md (WEB-06).');
    else if(a==='goimport') go('#/import');
    else if(a==='saveview') toast('View saved (prototype).');
    else if(a==='edit') toast('Edit form is in wireframes.md (WEB-06).');
    else if(a==='print') toast('Label preview is in wireframes.md (WEB-15).');
    else if(a==='repair') simpleDlg('Log repair','<div class="field"><label for="rd">Description (required)</label><input id="rd" class="input" autofocus></div><div class="field"><label for="rc">Cost</label><input id="rc" class="input" placeholder="$0.00"></div>','Save repair',act);
    else if(a==='bulkout'||a==='bulkprint'||a==='bulkedit') toast('Bulk action: '+a.replace('bulk','')+' (prototype).');
    return;
  }
  var row = t.closest('tbody tr[data-tag]');
  if(row && !t.closest('input,a,button')){ go('#/asset/'+row.getAttribute('data-tag')); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='st'){ state.status=t.value; render(); var s=document.getElementById('st'); if(s) s.focus(); }
  else if(t.id==='all'){ document.querySelectorAll('tbody tr[data-tag]').forEach(function(r){ state.sel[r.getAttribute('data-tag')] = t.checked; }); render(); }
  else if(t.hasAttribute && t.hasAttribute('data-sel')){ state.sel[t.getAttribute('data-sel')] = t.checked; render(); var c=document.querySelector('[data-sel="'+t.getAttribute('data-sel')+'"]'); if(c) c.focus(); }
});
document.addEventListener('input', function(e){
  if(e.target.id==='q'){ state.q = e.target.value; var pos=e.target.selectionStart; render(); var q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); }
  if(e.target.id==='palq'){ palFilter(e.target.value); }
});
document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id==='coForm'){
    var d = document.getElementById('dlg'), a = byTag(d.dataset.tag); if(!a) return;
    var active = d.querySelector('[data-mode][aria-selected="true"]').getAttribute('data-mode');
    var snap = JSON.stringify(a), stamp = '2026-11-17 '+('0'+new Date().getHours()).slice(-2)+':'+('0'+new Date().getMinutes()).slice(-2);
    history[a.tag] = history[a.tag] || [['2026-08-12 10:00','Created']];
    if(active==='out' || active==='transfer'){
      var who = document.getElementById('co-person').value, due = document.getElementById('co-due').value;
      a.status='Deployed'; a.who=who; a.due=due;
      history[a.tag].unshift([stamp,(active==='out'?'Checked out to ':'Transferred to ')+who+' by you. Due '+due]);
      toast('<strong>'+a.tag+'</strong> '+(active==='out'?'checked out to ':'transferred to ')+esc(who)+'.', function(){ var o=JSON.parse(snap); for(var k in o) a[k]=o[k]; history[a.tag].shift(); render(); toast('Undone.'); });
    } else {
      var st = document.getElementById('ci-status').value, from=a.who;
      a.status=st; a.who=''; a.due='';
      history[a.tag].unshift([stamp,'Checked in from '+(from||'user')+' by you. Condition: '+document.getElementById('ci-cond').value]);
      toast('<strong>'+a.tag+'</strong> checked in.', function(){ var o=JSON.parse(snap); for(var k in o) a[k]=o[k]; history[a.tag].shift(); render(); toast('Undone.'); });
    }
    render();
  } else if(f.querySelector('[data-save="field"]')){
    var v = document.getElementById('f-l').value.trim();
    if(v){ fields.push([v, document.getElementById('f-t').value, 'Selected', false, true]); toast('Field "'+esc(v)+'" added.'); render(); }
  } else if(f.closest('#dlg')) {
    toast('Saved (prototype).');
  }
});
document.addEventListener('keydown', function(e){
  var tgt = e.target, typing = tgt && (/^(INPUT|TEXTAREA|SELECT)$/.test(tgt.tagName));
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(document.getElementById('pal').open){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); palSel = Math.max(0, Math.min(palItems.length-1, palSel + (e.key==='ArrowDown'?1:-1))); document.querySelectorAll('#pall [data-pi]').forEach(function(b,i){ b.setAttribute('aria-selected', i===palSel); if(i===palSel) b.scrollIntoView({block:'nearest'}); }); }
    else if(e.key==='Enter'){ e.preventDefault(); palRun(palSel); }
    return;
  }
  if(e.key==='/' && !typing){ e.preventDefault(); document.getElementById('scan').focus(); }
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ var sub = document.querySelector('dialog[open] button[type=submit]'); if(sub && !sub.disabled){ e.preventDefault(); sub.click(); } }
});
document.getElementById('scan').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    var v = this.value.trim(); if(!v) return;
    var a = byTag(v);
    if(a){ this.value=''; go('#/asset/'+a.tag); toast('Opened '+a.tag+'.'); }
    else { toast('No asset with tag '+esc(v)+'.', null, true); }
  }
});
document.getElementById('palBtn').addEventListener('click', openPalette);
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('menuBtn').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
document.addEventListener('click', function(e){ if(document.body.classList.contains('nav-open') && !e.target.closest('.sidebar') && !e.target.closest('#menuBtn')) document.body.classList.remove('nav-open'); });
['dlg','drawer','pal'].forEach(function(id){ var d=document.getElementById(id); d.addEventListener('click', function(e){ if(e.target===d) closeDlg(d); }); });

/* ---------- init ---------- */
(function(){ var saved=null; try{ saved=localStorage.getItem('at-theme'); }catch(e){} if(saved==='dark'||saved==='light') document.documentElement.setAttribute('data-theme', saved); applyTheme(currentTheme()); })();
render();
})();
</script>
</body>
