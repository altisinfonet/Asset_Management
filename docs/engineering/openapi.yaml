  /v1/search:
    get:
      tags:
        - Search
      operationId: search
      summary: Search across the registry
      description: |-
        One box, several entity types. Results are filtered by the caller's permissions *per type* (and by location scope): a type the caller may not read is silently left out, never a `403`. `search:read` is granted to every built-in role; the per-type permissions are in `x-permission-by-type`.

        **Availability:** M1 returns `asset`, `model` and `category` results only. `person` and `location` are accepted values for `types` (so clients can send them today) but yield no results until M2 search lands. Matching is a case-insensitive prefix / trigram match on tag, serial, name and code. Archived records are excluded.

        Requires permission `search:read`.
      x-permission: search:read
      x-permission-by-type:
        asset: asset:read
        model: catalog:read
        category: catalog:read
        person: person:read
        location: location:read
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (1-200 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: types
          in: query
          description: "Comma-separated entity types to search. Default: every type available in this release."
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - asset
                - model
                - category
                - person
                - location
        - name: limit
          in: query
          description: Maximum results **per type**.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Grouped results (empty array when nothing matches).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
