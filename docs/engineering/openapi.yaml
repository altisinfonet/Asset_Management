  /v1/scan/resolve:
    get:
      tags:
        - Assets
      operationId: resolveScan
      summary: Resolve a scanned code
      description: |-
        Accepts the opaque QR `label_code`, the whole label URL (`<PUBLIC_URL>/s/<label_code>` or `/s/<label_code>`: its last path segment is used) a Code128 `asset_tag` or the exact device `serial` number (matched case-insensitively, tried in that order; `match_type` says which one it was), and returns the asset with the actions allowed right now. `entity_type` says what the code identifies: `asset`, or (M2 wave 2) `accessory` / `consumable`, which are found by the `label_code` of their label only and answered with their own member (`accessory` / `consumable`) and actions; the accessory and consumable answers need `accessory:read` / `consumable:read` (without it the code is a plain 404). `404` when nothing matches in the caller's tenant and scope: unknown, foreign and out-of-scope codes are indistinguishable. Enumeration resistance: a signed-in caller whose lookups keep missing (60 per throttle window by default) is answered `429` with `Retry-After` for every code until the window ends (hits never count towards the limit). The web route `/s/<label_code>` sends signed-out users to sign-in first and reveals nothing about the code; this endpoint answers `401` without a credential whatever the code. Responses are `Cache-Control: private, no-store`. A serial number is not unique per organisation: when it belongs to more than one asset the answer is `409 conflict` (scan the label or enter the tag instead) rather than a guess.

        Requires permission `asset:read`.
      x-permission: asset:read
      parameters:
        - name: code
          in: query
          required: true
          description: Scanned value.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The matching asset, accessory or consumable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResolveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The serial number belongs to several assets; use the label or the asset tag. Codes: `conflict`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/conflict
                title: conflict
                status: 409
                code: conflict
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - conflict
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/search:
    get:
      tags:
        - Search
      operationId: search
      summary: Search across the registry
      description: |-
        One box, several entity types. Results are filtered by the caller's permissions *per type* (and by location scope): a type the caller may not read is silently left out, never a `403`. `search:read` is granted to every built-in role; the per-type permissions are in `x-permission-by-type`.

        **Availability:** `asset`, `model`, `category`, `person` (name, email, employee number) and `location` (name, code) results. Matching is a case-insensitive prefix / trigram match on tag, serial, name and code. Archived records are excluded.

        Requires permission `search:read`.
      x-permission: search:read
      x-permission-by-type:
        asset: asset:read
        model: catalog:read
        category: catalog:read
        person: person:read
        location: location:read
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (1-200 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: types
          in: query
          description: "Comma-separated entity types to search. Default: every type available in this release."
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - asset
                - model
                - category
                - person
                - location
        - name: limit
          in: query
          description: Maximum results **per type**.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Grouped results (empty array when nothing matches).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
