        - dry_run_digest
      additionalProperties: false
    ImportRow:
      type: object
      properties:
        row_no:
          type: integer
          minimum: 1
        phase:
          type: string
          enum:
            - dry_run
            - commit
        outcome:
          type: string
          enum:
            - create
            - update
            - skip
            - error
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        source_data:
          type:
            - object
            - "null"
          additionalProperties: true
      required:
        - row_no
        - phase
        - outcome
        - errors
        - warnings
    ImportRowList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum:
            - user
            - api_key
            - integration
            - system
        actor_user_id:
          type:
            - string
            - "null"
          format: uuid
        actor_ref:
          type:
            - string
            - "null"
          format: uuid
        action:
          type: string
          examples:
            - asset.checkout
        entity_type:
          type: string
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        diff:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "`{before, after}` with sensitive fields redacted."
        ip:
          type:
            - string
            - "null"
        user_agent:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
      required:
        - id
        - at
        - actor_type
        - action
        - entity_type
    AuditEntryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        tenant_slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$
          description: Needed when the email exists in several tenants (or when using a tenant vanity host).
      required:
        - email
        - password
      additionalProperties: false
    TenantChoice:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
        - slug
        - name
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - authenticated
            - mfa_required
            - tenant_selection_required
        csrf_token:
          type: string
          description: "For `authenticated`: send as `X-CSRF-Token` on cookie-authenticated mutations."
        mfa:
          type: object
          properties:
            challenge_id:
              type: string
            methods:
              type: array
              items:
                type: string
                enum:
                  - totp
                  - webauthn
                  - recovery_code
          required:
            - challenge_id
            - methods
          description: For `mfa_required`.
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantChoice"
          description: For `tenant_selection_required`.
        user:
          $ref: "#/components/schemas/User"
      required:
        - status
    MfaVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
        method:
          type: string
          enum:
            - totp
            - webauthn
            - recovery_code
        code:
          type: string
          description: TOTP code, recovery code, or the WebAuthn assertion (JSON string).
      required:
        - challenge_id
        - method
        - code
      additionalProperties: false
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            plan:
              type: string
            base_currency:
              type: string
            cell:
              type: string
            branding:
              type: object
              properties:
                logo_url:
                  type:
                    - string
                    - "null"
                  format: uri
                  description: Absolute URL of the tenant logo. Always null until tenant branding ships (M4+).
                accent_color:
                  type:
                    - string
                    - "null"
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Accent colour as `#rrggbb`. Always null until tenant branding ships (M4+).
              required:
                - logo_url
                - accent_color
              description: Tenant branding for the web shell. Always present; both fields are null in M1-M3 (clients use the default theme).
          required:
            - id
            - name
            - base_currency
            - branding
        default_company_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
          description: Effective permissions of the principal (role permissions, or the API key scopes).
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        auth:
          type: object
          properties:
            method:
              type: string
              enum:
                - session
                - api_key
            mfa_verified:
              type: boolean
            api_key_id:
              type:
                - string
                - "null"
              format: uuid
            scopes:
              type: array
              items:
                type: string
          required:
            - method
        mfa_enrolment_required:
          type: boolean
          description: "True when tenant policy requires MFA for this user and the user has not enrolled yet. The session is then *limited*: every endpoint except `/v1/auth/me`, `/v1/auth/logout` and `/v1/auth/mfa/enrol*` returns 403 `mfa-enrolment-required`. Always false for API keys."
        session:
          oneOf:
            - $ref: "#/components/schemas/SessionExpiry"
            - type: "null"
          description: Lifetime of the current browser session; null when authenticated with an API key.
        csrf_token:
          type: string
          description: Only for cookie sessions.
      required:
        - user
        - tenant
        - permissions
        - auth
        - mfa_enrolment_required
        - session
    SessionExpiry:
      type: object
      properties:
        idle_expires_at:
          type: string
          format: date-time
          description: The session ends at this time unless there is activity before it; each authenticated request pushes it forward, never beyond `absolute_expires_at`.
        absolute_expires_at:
          type: string
          format: date-time
          description: Hard end of the session regardless of activity.
      required:
        - idle_expires_at
        - absolute_expires_at
    PasswordPolicy:
      type: object
      properties:
        min_length:
          type: integer
          description: Minimum length in Unicode code points after NFKC normalisation.
          examples:
            - 12
        max_length:
          type: integer
          description: Maximum length in Unicode code points (bounds hashing cost).
          examples:
            - 128
        composition_rules:
          type: boolean
          description: "Always false: no required character classes. Length and the breach check are the policy."
        breached_check:
          type: object
          properties:
            enabled:
              type: boolean
            sources:
              type: array
              items:
                type: string
                enum:
                  - local_list
                  - online_k_anonymity
              description: Always includes `local_list` (bundled, works offline and in self-hosted installs). `online_k_anonymity` is present only when the operator enabled the optional provider; only a hash prefix ever leaves the server.
          required:
            - enabled
            - sources
        rejection_codes:
          type: array
          items:
            type: string
            enum:
              - too-short
              - too-long
              - breached
          description: Field codes returned in `errors[].code` at pointer `/password` on a 422.
      required:
        - min_length
        - max_length
        - composition_rules
        - breached_check
      description: "The password rules enforced by `POST /v1/auth/password/reset` and `POST /v1/auth/invitations/accept`. Defaults: min 12, max 128, breached-password check on (bundled local list; optional online k-anonymity provider). Clients read this instead of hardcoding limits."
    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: "New password. Policy: 12-128 characters, no composition rules, NFKC-normalised, rejected if found in the breached-password list. A violation returns 422 with `errors[]` pointer `/password` and code `too-short`, `too-long` or `breached`. Live limits: `GET /v1/auth/password-policy`."
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Single-use token from the reset email link.
        password:
          $ref: "#/components/schemas/Password"
      required:
        - token
        - password
      additionalProperties: false
    InvitationInfo:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          description: Name the administrator entered; the invitee may change it on accept.
        tenant_name:
          type: string
        role_name:
          type: string
          description: Display name of the invited role (for example "Asset Manager").
        expires_at:
          type: string
          format: date-time
        mfa_enrolment_required:
          type: boolean
          description: "The tenant requires MFA for this role: after accepting, the new session is limited until the user enrols (see `Me.mfa_enrolment_required`)."
      required:
        - email
        - display_name
        - tenant_name
        - expires_at
        - mfa_enrolment_required
      description: What the accept-invitation screen shows before the user picks a password. Contains no secret.
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          description: Single-use invitation token from the email link.
        password:
          $ref: "#/components/schemas/Password"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - token
        - password
        - display_name
      additionalProperties: false
    MfaEnrolment:
      type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret, for manual entry.
        provisioning_uri:
          type: string
          description: "`otpauth://totp/...` URI that the QR code encodes."
      required:
        - secret
        - provisioning_uri
      description: A pending (not yet active) TOTP factor. It becomes active only after `POST /v1/auth/mfa/enrol/confirm`. Calling enrol again before confirming replaces the pending secret.
    MfaConfirmRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9 ]{6,8}$
          description: Current 6-digit TOTP code (spaces ignored).
      required:
        - code
      additionalProperties: false
    MfaRecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
          description: Ten single-use recovery codes. Shown **once**; only their hashes are stored. Any earlier set is invalidated.
      required:
        - recovery_codes
    ReauthRequest:
      type: object
      description: Proof of a recent sign-in for a sensitive action. Send the current password **or** a current TOTP code. A wrong value returns 403 `reauth-failed` and counts toward the account lockout.
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
        totp_code:
          type: string
          pattern: ^[0-9 ]{6,8}$
      anyOf:
        - required:
            - password
        - required:
            - totp_code
      additionalProperties: false
    SessionInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Session id (not the cookie token).
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ip:
          type:
            - string
            - "null"
          description: IP address the session was last seen from.
        user_agent:
          type:
            - string
            - "null"
          description: Raw or summarised user agent.
        current:
          type: boolean
          description: True for the session making this request.
      required:
        - id
        - created_at
        - last_seen_at
        - ip
        - user_agent
        - current
    SessionInfoList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
      required:
        - data
    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - asset
            - model
            - category
            - person
            - location
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Primary text, e.g. asset tag + name, model name, category name.
        sublabel:
          type:
            - string
            - "null"
          description: Secondary text, e.g. serial number or model; null if none.
        href_hint:
          type: string
          description: "App-relative path the web client may navigate to (for example `/assets/view?id=<uuid>`). A hint only: clients own routing and may build the URL from `type` and `id`."
      required:
        - type
        - id
        - label
        - sublabel
        - href_hint
    SearchResultList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
          description: "Grouped by type in the order of the `types` parameter (default: asset, model, category, person, location), best match first within a group; at most `limit` per type."
      required:
        - data
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum:
            - tenant
            - company
            - location
          default: tenant
        company_id:
          type:
            - string
            - "null"
          format: uuid
          description: Required when scope_type=company.
        location_id:
          type:
            - string
            - "null"
          format: uuid
          description: Required when scope_type=location; the grant covers the location subtree.
      required:
        - role_id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        archived_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        locale:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
          minItems: 1
        mfa_enabled:
          type: boolean
          readOnly: true
        last_login_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        person_id:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
      required:
        - id
        - email
        - display_name
        - role_assignments
      description: Login-capable account. People who only receive assets are `Person` records.
    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        locale:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
          minItems: 1
        send_invite:
          type: boolean
          default: true
      required:
        - email
        - display_name
        - role_assignments
      additionalProperties: false
    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        locale:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
          minItems: 1
      additionalProperties: false
      description: "Partial update (RFC 7396 merge semantics): omitted fields are unchanged, `null` clears a nullable field."
    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        permissions:
          type: array
          items:
            type: string
        is_builtin:
          type: boolean
      required:
        - id
        - key
        - name
        - permissions
        - is_builtin
    RoleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
      required:
        - data
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type:
            - string
            - "null"
        is_default:
          type: boolean
      required:
        - id
        - name
        - is_default
    CompanyList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Company"
      required:
        - data
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        key_prefix:
          type: string
          readOnly: true
        scopes:
          type: array
          items:
            type: string
          description: "`resource:action` strings; a subset of the creator's permissions."
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
      required:
        - id
        - name
        - key_prefix
        - scopes
    ApiKeyCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
          minItems: 1
        expires_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - name
        - scopes
      additionalProperties: false
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            secret:
              type: string
              description: The full key (`<prefix>.<secret>`). Shown **once**; only its hash is stored.
          required:
            - secret
    ApiKeyList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
x-problem-codes:
  bad-request:
    status:
      - 400
    description: "Malformed request: bad JSON, bad query parameter, invalid cursor."
  idempotency-key-required:
    status:
      - 400
    description: The operation needs an Idempotency-Key header and none was sent.
  idempotency-key-invalid:
    status:
      - 400
    description: The Idempotency-Key header is not 8-255 visible ASCII characters.
  unauthorized:
    status:
      - 401
    description: No credential, or the credential is not valid (generic).
  invalid-credentials:
    status:
      - 401
    description: Wrong email or password. Never reveals which one, or whether the account exists.
  mfa-invalid-code:
    status:
      - 401
      - 422
    description: The TOTP or recovery code is wrong, already used, or outside its window. 401 on the login challenge, 422 when confirming an enrolment.
  mfa-challenge-expired:
    status:
      - 401
    description: The MFA challenge from login is expired or already consumed; sign in again.
  session-expired:
    status:
      - 401
    description: The session hit its idle or absolute timeout, or was revoked; sign in again.
  forbidden:
    status:
      - 403
    description: Authenticated, but the principal lacks the required permission (or the request needs a browser session).
  csrf-invalid:
    status:
      - 403
    description: A cookie-authenticated mutation is missing a valid X-CSRF-Token.
  mfa-enrolment-required:
    status:
      - 403
    description: The tenant requires MFA and the user has not enrolled; only enrolment endpoints and logout work until then.
  mfa-required-by-policy:
    status:
      - 403
    description: The action (disabling MFA) is not allowed because tenant policy enforces MFA for this user.
  reauth-failed:
    status:
      - 403
    description: The password or TOTP code sent to re-authenticate a sensitive action is wrong.
  not-found:
    status:
      - 404
    description: The resource does not exist, belongs to another tenant, or is outside the caller's scope.
  token-invalid:
    status:
      - 404
    description: The password-reset token is unknown or already used.
  invitation-not-found:
    status:
      - 404
    description: The invitation token is unknown, already accepted or revoked.
  method-not-allowed:
    status:
      - 405
    description: The path exists but not for this HTTP method.
  conflict:
    status:
      - 409
    description: "State conflict: uniqueness violation, or the resource is in the wrong state for this action."
  idempotency-key-in-flight:
    status:
      - 409
    description: A request with the same Idempotency-Key is still running.
  cannot-revoke-current:
    status:
      - 409
    description: The current session cannot be revoked here; use sign out.
  mfa-already-enrolled:
    status:
      - 409
    description: The user already has an active TOTP factor; disable it first.
  asset-already-checked-out:
    status:
      - 409
    description: The asset is already checked out.
  asset-not-checked-out:
    status:
      - 409
    description: The asset has no open check-out to return.
  insufficient-stock:
    status:
      - 409
    description: Not enough quantity on hand.
  no-loaner-available:
    status:
      - 409
    description: The loaner pool has no available member.
  import-stale-dry-run:
    status:
      - 409
    description: The dry run being committed is not the one reviewed.
  token-expired:
    status:
      - 410
    description: The password-reset token has expired; request a new one.
  invitation-expired:
    status:
      - 410
    description: The invitation has expired; ask an administrator to resend it.
  precondition-failed:
    status:
      - 412
    description: "`If-Match` does not match the current version."
  payload-too-large:
    status:
      - 413
    description: The request body exceeds the size limit.
  unsupported-media-type:
    status:
      - 415
    description: The Content-Type is not supported.
  validation:
    status:
      - 422
    description: Validation failed; see errors[] (JSON pointer + message + field code).
  idempotency-key-reuse:
    status:
      - 422
    description: The Idempotency-Key was already used with a different request body.
  precondition-required:
    status:
      - 428
    description: "`If-Match` is required for this operation."
  account-locked:
    status:
      - 429
    description: Too many failed sign-in or re-authentication attempts; locked until Retry-After elapses.
  too-many-requests:
    status:
      - 429
    description: Rate limit exceeded; wait for Retry-After.
  internal:
    status:
      - 500
    description: Unexpected server error; quote request_id.
  unavailable:
    status:
      - 503
    description: A dependency is down or the service is starting.
