          minItems: 1
          maxItems: 2000
          uniqueItems: true
          description: The assets, printed in this order. Send this or `filter`.
        filter:
          $ref: "#/components/schemas/LabelAssetFilter"
        start_position:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: 1-based slot of the first label on the first sheet (re-use a partly used sheet); at most the template's `slots`. Slots are numbered row by row, left to right.
        copies:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Labels per asset, printed next to each other.
        codes:
          type: array
          items:
            type: string
            enum:
              - qr
              - code128
          maxItems: 2
          uniqueItems: true
          description: "Which codes to draw; default: the template's `code_type`. The QR encodes `<web base url>/s/<label_code>` (an opaque code, never an internal id), the Code128 encodes the asset tag (printable ASCII only). An empty list prints text only."
        fields:
          type: array
          items:
            type: string
            enum:
              - asset_tag
              - name
              - serial
              - location
              - model
              - organisation
          maxItems: 6
          uniqueItems: true
          description: "The text lines to print, first line first and largest; default: the template's `fields`. Text shrinks to fit and ends with an ellipsis when it still does not."
        logo_attachment_id:
          type:
            - string
            - "null"
          format: uuid
          description: "Optional logo: a clean PNG or JPEG attachment of your organisation (at most 2 MiB), printed small above the text."
        outlines:
          type: boolean
          default: false
          description: "Draw a hairline around every label: for calibration prints on plain paper."
      required:
        - template_key
      additionalProperties: false
      description: Exactly one of `asset_ids` and `filter`. At most 2000 assets and 2000 labels (assets x copies) per batch.
    LabelBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum:
            - queued
            - ready
            - failed
            - expired
          description: "`queued` until the worker has rendered the PDF, then `ready` (download it), `failed` (see `error`) or, after `expires_at`, `expired` (the file is deleted)."
          readOnly: true
        template_key:
          type: string
        source:
          type: string
          enum:
            - asset_ids
            - filter
        asset_count:
          type: integer
        copies:
          type: integer
        label_count:
          type: integer
          description: "Labels printed: `asset_count` x `copies`."
        start_position:
          type: integer
        codes:
          type: array
          items:
            type: string
            enum:
              - qr
              - code128
        fields:
          type: array
          items:
            type: string
            enum:
              - asset_tag
              - name
              - serial
              - location
              - model
              - organisation
        outlines:
          type: boolean
        logo_attachment_id:
          type:
            - string
            - "null"
          format: uuid
        page_count:
          type:
            - integer
            - "null"
          description: Sheets in the PDF, once rendered.
        filename:
          type:
            - string
            - "null"
          description: Suggested file name, once ready.
        size_bytes:
          type:
            - integer
            - "null"
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        rendered_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          description: After this moment the file is deleted and the batch becomes `expired`.
          readOnly: true
        download_url:
          type:
            - string
            - "null"
          format: uri
          description: A short-lived presigned URL of the PDF; only when `ready`. A fresh one comes with every read.
          readOnly: true
        download_expires_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                  description: e.g. `logo-invalid`, `render-failed`.
                detail:
                  type: string
              required:
                - code
                - detail
            - type: "null"
          description: Why the batch failed; `null` otherwise.
          readOnly: true
      required:
        - id
        - status
        - template_key
        - source
        - asset_count
        - copies
        - label_count
        - start_position
        - codes
        - fields
        - outlines
        - page_count
        - created_at
        - expires_at
        - download_url
        - error
      description: One request to print labels. Visible to the user (or API key) that made it, nobody else.
    LabelBatchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LabelBatch"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entity_type:
          type: string
          enum:
            - asset
            - asset_model
            - accessory
            - consumable
            - location
            - person
            - maintenance_record
            - assignment
            - import_job
        entity_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - photo
            - document
            - signature
            - import_file
            - other
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{64}$
        scan_status:
          type: string
          enum:
            - pending
            - clean
            - infected
            - error
          readOnly: true
        uploaded_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        scan_detail:
          type:
            - string
            - "null"
          description: "Why the status is what it is: the signature name when `infected`, a short reason when `error` (`size-mismatch`, `content-mismatch`, `upload-abandoned`...), `scan-disabled` when the deployment runs without a scanner."
          readOnly: true
        width:
          type:
            - integer
            - "null"
          description: Pixel width of an image, once its thumbnail exists.
          readOnly: true
        height:
          type:
            - integer
            - "null"
          description: Pixel height of an image, once its thumbnail exists.
          readOnly: true
        thumbnail_url:
          type:
            - string
            - "null"
          format: uri
          description: Short-lived URL of the metadata-free WebP thumbnail (images only, once generated, and only when `scan_status=clean`). Present on list and get.
          readOnly: true
        download_url:
          type:
            - string
            - "null"
          format: uri
          description: Short-lived signed URL, only when `scan_status=clean`; present on the list and on `GET /v1/attachments/{id}` alike (no per-item request needed). Images are served inline, everything else as an attachment download.
          readOnly: true
      required:
        - id
        - entity_type
        - entity_id
        - kind
        - filename
        - content_type
        - size_bytes
        - scan_status
        - created_at
    AttachmentCreate:
      type: object
      properties:
        entity_type:
          type: string
          enum:
            - asset
            - asset_model
            - accessory
            - consumable
            - location
            - person
            - maintenance_record
            - assignment
            - import_job
        entity_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - photo
            - document
            - signature
            - import_file
            - other
          default: document
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - entity_type
        - entity_id
        - filename
        - content_type
        - size_bytes
      additionalProperties: false
    AttachmentUpload:
      type: object
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
        upload:
          type: object
          properties:
            method:
              type: string
              enum:
                - PUT
            url:
              type: string
              format: uri
              description: Presigned URL with size and content-type conditions; PUT the bytes here.
            headers:
              type: object
              additionalProperties:
                type: string
              description: Headers that must accompany the PUT.
            expires_at:
              type: string
              format: date-time
          required:
            - method
            - url
            - expires_at
      required:
        - attachment
        - upload
    AttachmentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    FilesSettings:
      type: object
      properties:
        strip_exif_original:
          type: boolean
          description: Re-encode every uploaded image without EXIF/GPS metadata (the stored original is replaced). Thumbnails are always metadata-free.
        max_upload_bytes:
          type:
            - integer
            - "null"
          minimum: 1024
          description: Lower the upload cap below the tier default; `null` = the tier default. It can never raise the cap above the tier.
        effective_max_upload_bytes:
          type: integer
          description: "The cap that applies: the smaller of the override (or tier default) and the deployment ceiling."
          readOnly: true
        tier_max_upload_bytes:
          type: integer
          description: The cap of the organisation's plan.
          readOnly: true
      required:
        - strip_exif_original
        - max_upload_bytes
    FilesSettingsUpdate:
      type: object
      properties:
        strip_exif_original:
          type: boolean
        max_upload_bytes:
          type:
            - integer
            - "null"
          minimum: 1024
      required:
        - strip_exif_original
        - max_upload_bytes
      additionalProperties: false
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum:
            - user
            - api_key
            - integration
            - system
        actor_user_id:
          type:
            - string
            - "null"
          format: uuid
        actor_ref:
          type:
            - string
            - "null"
          format: uuid
        action:
          type: string
          examples:
            - asset.checkout
        entity_type:
          type: string
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        diff:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "`{before, after}` with sensitive fields redacted."
        ip:
          type:
            - string
            - "null"
        user_agent:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
      required:
        - id
        - at
        - actor_type
        - action
        - entity_type
    AuditEntryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        tenant_slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$
          description: Needed when the email exists in several tenants (or when using a tenant vanity host).
      required:
        - email
        - password
      additionalProperties: false
    TenantChoice:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
        - slug
        - name
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - authenticated
            - mfa_required
            - tenant_selection_required
        csrf_token:
          type: string
          description: "For `authenticated`: send as `X-CSRF-Token` on cookie-authenticated mutations."
        mfa:
          type: object
          properties:
            challenge_id:
              type: string
            methods:
              type: array
              items:
                type: string
                enum:
                  - totp
                  - webauthn
                  - recovery_code
          required:
            - challenge_id
            - methods
          description: For `mfa_required`.
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantChoice"
          description: For `tenant_selection_required`.
        user:
          $ref: "#/components/schemas/User"
      required:
        - status
    MfaVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
        method:
          type: string
          enum:
            - totp
            - webauthn
            - recovery_code
        code:
          type: string
          description: TOTP code, recovery code, or the WebAuthn assertion (JSON string).
      required:
        - challenge_id
        - method
        - code
      additionalProperties: false
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            plan:
              type: string
            base_currency:
              type: string
            cell:
              type: string
            branding:
              type: object
              properties:
                logo_url:
                  type:
                    - string
                    - "null"
                  format: uri
                  description: Absolute URL of the tenant logo. Always null until tenant branding ships (M4+).
                accent_color:
                  type:
                    - string
                    - "null"
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Accent colour as `#rrggbb`. Always null until tenant branding ships (M4+).
              required:
                - logo_url
                - accent_color
              description: Tenant branding for the web shell. Always present; both fields are null in M1-M3 (clients use the default theme).
          required:
            - id
            - name
            - base_currency
            - branding
        default_company_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
          description: Effective permissions of the principal (role permissions, or the API key scopes).
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        auth:
          type: object
          properties:
            method:
              type: string
              enum:
                - session
                - api_key
            mfa_verified:
              type: boolean
            api_key_id:
              type:
                - string
                - "null"
              format: uuid
            scopes:
              type: array
              items:
                type: string
          required:
            - method
        mfa_enrolment_required:
          type: boolean
          description: "True when tenant policy requires MFA for this user and the user has not enrolled yet. The session is then *limited*: every endpoint except `/v1/auth/me`, `/v1/auth/logout` and `/v1/auth/mfa/enrol*` returns 403 `mfa-enrolment-required`. Always false for API keys."
        session:
          oneOf:
            - $ref: "#/components/schemas/SessionExpiry"
            - type: "null"
          description: Lifetime of the current browser session; null when authenticated with an API key.
        csrf_token:
          type: string
          description: Only for cookie sessions.
        mfa_policy:
          type: object
          properties:
            required:
              type: boolean
              description: True when the policy requires THIS user to have two-step verification (always false for API keys). While true, "Turn off" is refused with `403 mfa-required-by-policy`.
            scope:
              type: string
              enum:
                - off
                - admins
                - all
              description: "Who the organisation requires to use two-step verification: nobody, administrators (roles holding `*` or `user:manage`), or everybody."
          required:
            - required
            - scope
          description: The organisation's MFA policy and whether it applies to the caller (M2-AUTH-01).
      required:
        - user
        - tenant
        - permissions
        - auth
        - mfa_enrolment_required
        - session
        - mfa_policy
    SessionExpiry:
      type: object
      properties:
        idle_expires_at:
          type: string
          format: date-time
          description: The session ends at this time unless there is activity before it; each authenticated request pushes it forward, never beyond `absolute_expires_at`.
        absolute_expires_at:
          type: string
          format: date-time
          description: Hard end of the session regardless of activity.
      required:
        - idle_expires_at
        - absolute_expires_at
    PasswordPolicy:
      type: object
      properties:
        min_length:
          type: integer
          description: Minimum length in Unicode code points after NFKC normalisation.
          examples:
            - 12
        max_length:
          type: integer
          description: Maximum length in Unicode code points (bounds hashing cost).
          examples:
            - 128
        composition_rules:
          type: boolean
          description: "Always false: no required character classes. Length and the breach check are the policy."
        breached_check:
          type: object
          properties:
            enabled:
              type: boolean
            sources:
              type: array
              items:
                type: string
                enum:
                  - local_list
                  - online_k_anonymity
              description: Always includes `local_list` (bundled, works offline and in self-hosted installs). `online_k_anonymity` is present only when the operator enabled the optional provider; only a hash prefix ever leaves the server.
          required:
            - enabled
            - sources
        rejection_codes:
          type: array
          items:
            type: string
            enum:
              - too-short
              - too-long
              - breached
          description: Field codes returned in `errors[].code` at pointer `/password` on a 422.
      required:
        - min_length
        - max_length
        - composition_rules
        - breached_check
      description: "The password rules enforced by `POST /v1/auth/password/reset` and `POST /v1/auth/invitations/accept`. Defaults: min 12, max 128, breached-password check on (bundled local list; optional online k-anonymity provider). Clients read this instead of hardcoding limits."
    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: "New password. Policy: 12-128 characters, no composition rules, NFKC-normalised, rejected if found in the breached-password list. A violation returns 422 with `errors[]` pointer `/password` and code `too-short`, `too-long` or `breached`. Live limits: `GET /v1/auth/password-policy`."
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Single-use token from the reset email link.
        password:
          $ref: "#/components/schemas/Password"
      required:
        - token
        - password
      additionalProperties: false
    InvitationInfo:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          description: Name the administrator entered; the invitee may change it on accept.
        tenant_name:
          type: string
        role_name:
          type: string
          description: Display name of the invited role (for example "Asset Manager").
        expires_at:
          type: string
          format: date-time
        mfa_enrolment_required:
          type: boolean
          description: "The tenant requires MFA for this role: after accepting, the new session is limited until the user enrols (see `Me.mfa_enrolment_required`)."
      required:
        - email
        - display_name
        - tenant_name
        - expires_at
        - mfa_enrolment_required
      description: What the accept-invitation screen shows before the user picks a password. Contains no secret.
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          description: Single-use invitation token from the email link.
        password:
          $ref: "#/components/schemas/Password"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - token
        - password
        - display_name
      additionalProperties: false
    MfaEnrolment:
      type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret, for manual entry.
        provisioning_uri:
          type: string
          description: "`otpauth://totp/...` URI that the QR code encodes."
      required:
        - secret
        - provisioning_uri
      description: A pending (not yet active) TOTP factor. It becomes active only after `POST /v1/auth/mfa/enrol/confirm`. Calling enrol again before confirming replaces the pending secret.
    MfaConfirmRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9 ]{6,8}$
          description: Current 6-digit TOTP code (spaces ignored).
      required:
        - code
      additionalProperties: false
    MfaRecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
          description: Ten single-use recovery codes. Shown **once**; only their hashes are stored. Any earlier set is invalidated.
      required:
        - recovery_codes
    MfaEnrolmentConfirmed:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
          description: Ten single-use recovery codes. Shown **once**; only their hashes are stored. Any earlier set is invalidated.
        csrf_token:
          type: string
          description: "The session is rotated on activation, so the CSRF token changes: store this one and send it as `X-CSRF-Token` on the next cookie-authenticated mutation."
      required:
        - recovery_codes
        - csrf_token
    ReauthRequest:
      type: object
      description: Proof of a recent sign-in for a sensitive action. Send the current password **or** a current TOTP code. A wrong value returns 403 `reauth-failed` and counts toward the account lockout.
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
        totp_code:
          type: string
          pattern: ^[0-9 ]{6,8}$
      anyOf:
        - required:
            - password
        - required:
            - totp_code
      additionalProperties: false
    SessionInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Session id (not the cookie token).
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ip:
          type:
            - string
            - "null"
          description: IP address the session was last seen from.
        user_agent:
          type:
            - string
            - "null"
          description: Raw or summarised user agent.
        current:
          type: boolean
          description: True for the session making this request.
      required:
        - id
        - created_at
        - last_seen_at
        - ip
        - user_agent
        - current
    SessionInfoList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
      required:
        - data
    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - asset
            - model
            - category
            - person
            - location
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Primary text, e.g. asset tag + name, model name, category name.
        sublabel:
          type:
            - string
            - "null"
          description: Secondary text, e.g. serial number or model; null if none.
        href_hint:
          type: string
          description: "App-relative path the web client may navigate to (for example `/assets/view?id=<uuid>`). A hint only: clients own routing and may build the URL from `type` and `id`."
      required:
        - type
        - id
        - label
        - sublabel
        - href_hint
    SearchResultList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
          description: "Grouped by type in the order of the `types` parameter (default: asset, model, category, person, location), best match first within a group; at most `limit` per type."
      required:
        - data
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum:
            - tenant
            - company
            - location
          default: tenant
        company_id:
          type:
            - string
            - "null"
          format: uuid
          description: Required when scope_type=company.
        location_id:
          type:
            - string
            - "null"
