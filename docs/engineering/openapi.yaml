  /v1/people/{id}/link-user:
    post:
      tags:
        - People
      operationId: linkPersonToUser
      summary: Link a person to a login account
      description: |-
        Makes the person the person record of the login account (Administrators only, audited as `person.user_linked`). Every login account already has the person the database created for it, so linking **replaces** that placeholder: it is archived (never deleted; its history keeps pointing at it) and a department it headed is headed by the linked person. The linked person keeps all of its assignments and history. One person per login and one login per person: a person that already has a login is 409 `person-already-linked`, a login whose person was chosen by somebody (not the system-made placeholder, which has no `created_by`) is 409 `login-already-linked` (unlink it first), a placeholder that still holds assets is 409 `login-person-in-use` (`usage.open_assignments`). Linking the pair that is already linked changes nothing (200). 422 `/user_id` when the account does not exist in the tenant or is archived. The person's name and email are not changed, but a later rename of the login account renames the person again (ED-15).

        Requires permission `user:manage`.
      x-permission: user:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonLinkUserRequest"
            example:
              user_id: 0197a3c2-1b6e-7c3a-8d41-2f5b6a7c8d92
      responses:
        "200":
          description: Linked. The person (`user_id` set); `ETag` is its new version.
          headers:
