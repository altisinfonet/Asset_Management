  /v1/attachments:
    get:
      tags:
        - Attachments
      operationId: listAttachments
      summary: List attachments of a record
      description: Requires permission `attachment:read`.
      x-permission: attachment:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: entity_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - asset
              - asset_model
              - accessory
              - consumable
              - location
              - person
              - maintenance_record
              - assignment
              - import_job
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          description: Filter by kind.
          schema:
            type: string
            enum:
              - photo
              - document
              - signature
              - import_file
              - other
      responses:
        "200":
          description: A page of attachments.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Attachments
      operationId: createAttachment
      summary: Start an upload
      description: |-
        Creates the metadata row (`scan_status=pending`) and returns a presigned PUT URL with size and content-type conditions and a tenant-prefixed key. After the PUT, call `POST /v1/attachments/{id}/complete`.

        The declared `content_type` must be on the allow-list (JPEG, PNG, WebP, GIF, PDF, Office documents, ODF, CSV; never SVG or HTML) and match the file name extension; the size must be within the organisation's cap. The owner (`entity_type` + `entity_id`) must exist in your organisation (`422` otherwise, also for an owner type that is not available yet). To attach photos to a record that does not exist yet (a check-in), upload them against the asset and send their ids with the check-in.

        Requires permission `attachment:write`.
      x-permission: attachment:write
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCreate"
      responses:
        "201":
          description: Upload prepared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: "The file is larger than the organisation's upload cap. Codes: `payload-too-large`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/payload-too-large
                title: payload too large
                status: 413
                code: payload-too-large
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - payload-too-large
        "415":
          description: "The file type is not allowed, or does not match the file name extension. Codes: `unsupported-media-type`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/unsupported-media-type
                title: unsupported media type
                status: 415
                code: unsupported-media-type
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - unsupported-media-type
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/attachments/{id}:
    get:
      tags:
        - Attachments
      operationId: getAttachment
      summary: Get an attachment
      description: |-
        Returns a short-lived `download_url` only when the virus scan has finished clean.

        Requires permission `attachment:read`.
      x-permission: attachment:read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The attachment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Attachments
      operationId: archiveAttachment
      summary: Archive an attachment
      description: |-
        Soft delete. `409` while the attachment is the primary picture of an asset or model (clear it there first).

        Requires permission `attachment:write`.
      x-permission: attachment:write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Archived.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/attachments/{id}/complete:
    post:
      tags:
        - Attachments
      operationId: completeAttachment
      summary: Confirm an upload
      description: |-
        Verifies the object exists with exactly the declared size, checks that its first bytes are really of the declared type, and queues the virus scan. Idempotent: confirming twice returns the same attachment. A rejected upload (wrong size, content that does not match its type) is archived with `scan_status=error` and its object deleted.

        Requires permission `attachment:write`.
      x-permission: attachment:write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Upload confirmed; scan queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "No object was uploaded yet. Codes: `upload-missing`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/upload-missing
                title: upload missing
                status: 409
                code: upload-missing
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - upload-missing
        "413":
          description: "The uploaded object is larger than declared or allowed. Codes: `payload-too-large`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/payload-too-large
                title: payload too large
                status: 413
                code: payload-too-large
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - payload-too-large
        "415":
          description: "The content does not match the declared type. Codes: `unsupported-media-type`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/unsupported-media-type
                title: unsupported media type
                status: 415
                code: unsupported-media-type
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - unsupported-media-type
        "422":
          description: "The uploaded size differs from the declared size. Codes: `validation`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/validation
                title: validation
                status: 422
                code: validation
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - validation
        "429":
          $ref: "#/components/responses/TooManyRequests"
