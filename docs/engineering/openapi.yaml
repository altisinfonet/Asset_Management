          $ref: "#/components/responses/TooManyRequests"
  /v1/version:
    get:
      tags:
        - System
      operationId: getVersion
      summary: Build version
      security: []
      description: Name, version, commit and process role of the running build. No credential needed.
      responses:
        "200":
          description: The build.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-at_session
      description: Browser session cookie issued by `POST /v1/auth/login`. Mutations also need the `X-CSRF-Token` header.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: at_<prefix>.<secret>
      description: "Scoped API key (also used by the mobile app after login). Send as `Authorization: Bearer <key>`."
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource id (UUIDv7).
      schema:
        type: string
        format: uuid
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      description: Asset id.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `page.next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IncludeTotal:
      name: include_total
      in: query
      description: Also return `page.total` (an extra count query; avoid on large lists).
      schema:
        type: boolean
        default: false
    Archived:
      name: archived
      in: query
      description: "Archived (soft-deleted) records: `exclude` (default), `include` or `only`."
      schema:
        type: string
        enum:
          - exclude
          - include
          - only
        default: exclude
    Q:
      name: q
      in: query
      description: Free-text search (trigram / prefix match).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key making the request safely retryable (8-255 chars). Optional here; recommended for mobile and scripts.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (8-255 chars) so the operation can be retried without being applied twice. Required.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified. `428` if absent, `412` if stale.
      schema:
        type: string
        examples:
          - W/"7"
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: ETag of the asset the client acted on; if it changed, the request fails with `412` and the client should refresh.
      schema:
        type: string
        examples:
          - W/"7"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for mutating requests authenticated with the session cookie; ignored for API keys.
      schema:
        type: string
  headers:
    ETag:
      description: Weak entity tag of the resource version, `W/"<version>"`. Send it back in `If-Match`.
      schema:
        type: string
        examples:
          - W/"7"
    Location:
      description: URL of the created or queued resource.
      schema:
        type: string
        format: uri-reference
    RequestId:
      description: Server-generated request id; quote it in support requests.
      schema:
        type: string
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplayed:
      description: "`true` when the response is a replay of an earlier request with the same Idempotency-Key."
      schema:
        type: boolean
    SetCookie:
      description: Session cookie `__Host-at_session`.
      schema:
        type: string
  responses:
    BadRequest:
      description: "Malformed request (bad JSON, bad query parameter, invalid cursor). Codes: `bad-request`, `idempotency-key-required`, `idempotency-key-invalid`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.assettracker.test/problems/bad-request
            title: Bad request
            status: 400
            code: bad-request
            detail: Query parameter "limit" must be between 1 and 200.
            request_id: 01JABCDEF0123456789
      x-problem-codes:
        - bad-request
        - idempotency-key-required
        - idempotency-key-invalid
    Unauthorized:
      description: "Missing, invalid or expired credentials. Codes: `unauthorized`, `session-expired`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          description: Authentication scheme.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - unauthorized
        - session-expired
    Forbidden:
      description: "Authenticated, but the principal lacks the required permission (or MFA enrolment is required). Codes: `forbidden`, `csrf-invalid`, `mfa-enrolment-required`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - forbidden
        - csrf-invalid
        - mfa-enrolment-required
    NotFound:
      description: "The resource does not exist **or belongs to another tenant or is outside the caller's scope**. Codes: `not-found`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - not-found
    Conflict:
      description: "State conflict: uniqueness violation, asset already checked out, insufficient stock, or an Idempotency-Key request still in flight. Codes: `conflict`, `idempotency-key-in-flight`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - conflict
        - idempotency-key-in-flight
    PreconditionFailed:
      description: "`If-Match` does not match the current version; re-read and retry. Codes: `precondition-failed`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - precondition-failed
    PreconditionRequired:
      description: "`If-Match` header is required for this operation. Codes: `precondition-required`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - precondition-required
    Unprocessable:
      description: "Validation failed (see `errors[]`), or an Idempotency-Key was reused with a different body. Codes: `validation`, `idempotency-key-reuse`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.assettracker.test/problems/validation
            title: Validation failed
            status: 422
            code: validation
            errors:
              - pointer: /asset_tag
                message: must not contain whitespace
                code: pattern
            request_id: 01JABCDEF0123456789
      x-problem-codes:
        - validation
        - idempotency-key-reuse
    TooManyRequests:
      description: "Rate limit exceeded. Codes: `too-many-requests`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - too-many-requests
  schemas:
    AssetCloneRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        copy_fields:
          type: array
          items:
            type: string
            enum:
              - name
              - model_id
              - status_id
              - vendor_id
              - location_id
              - department_id
              - parent_asset_id
              - purchase_date
              - purchase_cost
              - order_number
              - warranty_end
              - notes
              - custom_data
          description: Fields to copy from the source. Default - all of them.
        asset_tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^\S+$
          description: One explicit tag per copy; omit to generate them from the numbering template.
      additionalProperties: false
    AssetCloneResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
      required:
        - data
    BulkAssetIds:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
      required:
        - ids
      additionalProperties: false
    BulkAssetUpdate:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
        changes:
          type: object
          properties:
            status_id:
              type: string
              format: uuid
            category_id:
              type: string
              format: uuid
            model_id:
              type:
                - string
                - "null"
              format: uuid
            vendor_id:
              type:
                - string
                - "null"
              format: uuid
            department_id:
              type:
                - string
                - "null"
              format: uuid
              description: "[ED-17] Department for every listed asset; `null` clears it."
            custom_data:
              $ref: "#/components/schemas/CustomData"
          description: At least one of these. `custom_data` merges per key (`null` removes a key).
          additionalProperties: false
      required:
        - ids
        - changes
      additionalProperties: false
    BulkAssetResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              status:
                type: integer
                description: HTTP status the single-asset operation would have returned.
              data:
                $ref: "#/components/schemas/Asset"
              error:
                $ref: "#/components/schemas/Problem"
            required:
              - index
              - status
        summary:
          type: object
          properties:
            total:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
          required:
            - total
            - succeeded
            - failed
      required:
        - results
        - summary
    AssetTagTemplate:
      type: object
      properties:
        prefix:
          type: string
          pattern: ^[A-Z0-9-]{0,12}$
          default: ""
        width:
          type: integer
          minimum: 1
          maximum: 12
          default: 5
          description: Zero-padded width of the counter.
        use_category_prefix:
          type: boolean
          default: true
        example:
          type: string
          readOnly: true
          description: A sample tag produced by the template (counter 42).
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        checks:
          type: object
          properties:
            db:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ok
                    - error
                latencyMs:
                  type: number
                  minimum: 0
                  description: Round trip of the database probe (only when `ok`).
                error:
                  type: string
                  description: Why the probe failed (only when `error`).
              required:
                - status
          required:
            - db
        uptimeSeconds:
          type: number
          minimum: 0
      required:
        - status
        - checks
        - uptimeSeconds
      description: Health of the API process and its database. `200` when `ok`, `503` (same shape) when `degraded`.
    VersionResponse:
      type: object
      properties:
        name:
          type: string
          description: Package name of the API build.
        version:
          type: string
          description: Semantic version of the build.
        commit:
          type: string
          description: Git commit the image was built from (`dev` for local runs).
        role:
          type: string
          description: "Process role: `api`, `worker`, `scheduler` or `migrate`."
      required:
        - name
        - version
        - commit
        - role
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ProblemCode"
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        usage:
          type: object
          description: 'Extension member of a `409` that refuses to delete or change something still in use: what references it (for example `{"assets": 12, "models": 3}`).'
          additionalProperties:
            type: integer
      required:
        - type
        - title
        - status
      description: RFC 9457 problem details.
    ProblemCode:
      type: string
      description: "Stable machine-readable problem code. The set is open (new codes may appear): branch on codes you know and fall back to the HTTP status. The full catalogue (code, HTTP status, meaning) is the root `x-problem-codes` extension of this document; each error response lists its own subset in `x-problem-codes`."
      examples:
        - validation
        - invalid-credentials
        - mfa-enrolment-required
        - asset-already-checked-out
      x-known-values:
        - bad-request
        - invalid-cursor
        - idempotency-key-required
        - idempotency-key-invalid
        - unauthorized
        - invalid-credentials
        - mfa-invalid-code
        - mfa-challenge-expired
        - session-expired
        - forbidden
        - csrf-invalid
        - mfa-enrolment-required
        - mfa-required-by-policy
        - reauth-failed
        - not-found
        - token-invalid
        - invitation-not-found
        - method-not-allowed
        - conflict
        - idempotency-key-in-flight
        - cannot-revoke-current
        - mfa-already-enrolled
        - asset-already-checked-out
        - asset-not-checked-out
        - person-already-linked
        - login-already-linked
        - login-person-in-use
        - undo-expired
        - undo-asset-changed
        - undo-not-possible
        - asset-not-deployable
        - insufficient-stock
        - no-loaner-available
        - import-stale-dry-run
        - import-wrong-state
        - import-quota-exceeded
        - loan-limit-reached
        - loaner-pool-inactive
        - upload-missing
        - token-expired
        - invitation-expired
        - precondition-failed
        - payload-too-large
        - unsupported-media-type
        - validation
        - idempotency-key-reuse
        - precondition-required
        - account-locked
        - too-many-requests
        - internal
        - unavailable
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON pointer into the request body, or `query:<name>`.
        message:
          type: string
        code:
          type: string
          description: Per-field code, e.g. `pattern`, `required`; for passwords `too-short`, `too-long`, `breached`.
      required:
        - pointer
        - message
