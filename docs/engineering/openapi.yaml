            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAssetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
