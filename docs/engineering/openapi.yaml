  /v1/assets:
    get:
      tags:
        - Assets
      operationId: listAssets
      summary: List and search assets
      description: |-
        The main registry query. `q` searches tag, serial and name (trigram); `tag` / `serial` are exact. Soft-deleted assets are excluded unless `archived` says otherwise.

        [M2-REG-03, ED-22] `sort` also takes `location` (the full location path, `HQ > Floor 2 > Room 4`, case-insensitive), `assignee` (the name of whoever holds the asset: person, location or asset tag, case-insensitive) and `due` (the expected return date of the open custody). For these three keys an asset with no value (no location, not checked out, no expected return) is listed **last in both directions**, ordered by `id` among themselves, so a page boundary never splits or repeats rows. The other keys keep sorting an empty value as the smallest. Cursors are bound to the sort: a cursor of another sort is 400 `invalid-cursor`.

        Requires permission `asset:read`.
      x-permission: asset:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTotal"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Archived"
        - name: tag
          in: query
          description: Exact asset tag (case-insensitive) - the barcode scan path.
          schema:
            type: string
        - name: serial
          in: query
          description: Exact serial number.
          schema:
            type: string
        - name: status_id
          in: query
          description: Any of these status labels.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: state_type
          in: query
          description: Any of these state types.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - deployable
                - deployed
                - pending
                - undeployable
                - archived
                - lost
        - name: category_id
          in: query
          description: Any of these categories.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: model_id
          in: query
          description: Any of these models.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: manufacturer_id
          in: query
          description: Via the model.
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          description: Assets at this location.
          schema:
            type: string
            format: uuid
        - name: department_id
          in: query
          description: "[ED-17] Assets of this department."
          schema:
            type: string
            format: uuid
        - name: include_sublocations
          in: query
          description: "With `location_id`: include the whole subtree."
          schema:
            type: boolean
            default: true
        - name: company_id
          in: query
          description: Filter by company.
          schema:
            type: string
            format: uuid
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            type: string
            format: uuid
        - name: parent_asset_id
          in: query
          description: Children of this asset.
          schema:
            type: string
            format: uuid
        - name: assigned_person_id
          in: query
          description: Currently checked out to this person.
          schema:
            type: string
            format: uuid
        - name: assigned
          in: query
          description: true = checked out, false = in stock.
          schema:
            type: boolean
        - name: overdue
          in: query
          description: "[M2-W1] true = checked out with an `expected_return` before today (UTC); false = every other asset."
          schema:
            type: boolean
        - name: loaner_pool_id
          in: query
          description: "[LOAN] Members of this loaner pool (ED-20)."
          schema:
            type: string
            format: uuid
        - name: in_loaner_pool
          in: query
          description: "[LOAN] true = member of any loaner pool, false = in none."
          schema:
            type: boolean
        - name: warranty_end_before
          in: query
          description: Warranty ends on or before.
          schema:
            type: string
            format: date
        - name: warranty_end_after
          in: query
          description: Warranty ends on or after.
          schema:
            type: string
            format: date
        - name: purchase_date_from
          in: query
          description: Purchased on or after.
          schema:
            type: string
            format: date
        - name: purchase_date_to
          in: query
          description: Purchased on or before.
          schema:
            type: string
            format: date
        - name: updated_since
          in: query
          description: Changed at or after (incremental sync).
          schema:
            type: string
            format: date-time
        - name: cf
          in: query
          style: deepObject
          explode: true
          description: Custom field filters, e.g. `cf[warranty_tier]=gold`. Exact match on the JSONB value.
          schema:
            type: object
            additionalProperties:
              type: string
        - name: expand
          in: query
          description: Embed related objects under `expanded`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - model
                - category
                - location
                - vendor
                - department
        - name: fields
          in: query
          description: "Sparse fieldset: return only these top-level properties (`id` is always included)."
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          style: form
          explode: false
          description: "Comma-separated sort keys, `-` prefix = descending. Allowed: created_at, updated_at, asset_tag, name, purchase_date, warranty_end, location, assignee, due. A unique tiebreaker (`id`) is always appended."
          schema:
            type: array
            items:
              type: string
              enum:
                - created_at
                - -created_at
                - updated_at
                - -updated_at
                - asset_tag
                - -asset_tag
                - name
                - -name
                - purchase_date
                - -purchase_date
                - warranty_end
                - -warranty_end
                - location
                - -location
                - assignee
                - -assignee
                - due
                - -due
            default:
              - -created_at
      responses:
        "200":
          description: A page of assets.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Assets
      operationId: createAsset
      summary: Create an asset
      description: |-
        Writes the asset, a `created` history event, an audit record and an outbox event in one transaction. `custom_data` is validated against the category's custom field definitions.

        Requires permission `asset:create`.
      x-permission: asset:create
