x-problem-codes:
  bad-request:
    status:
      - 400
    description: "Malformed request: bad JSON, bad query parameter."
  invalid-cursor:
    status:
      - 400
    description: "The cursor is not valid for this list: it is garbled, or it was issued for a different sort or filter. Start again without a cursor."
  idempotency-key-required:
    status:
      - 400
    description: The operation needs an Idempotency-Key header and none was sent.
  idempotency-key-invalid:
    status:
      - 400
    description: The Idempotency-Key header is not 8-255 visible ASCII characters.
  unauthorized:
    status:
      - 401
    description: No credential, or the credential is not valid (generic).
  invalid-credentials:
    status:
      - 401
    description: Wrong email or password. Never reveals which one, or whether the account exists.
  mfa-invalid-code:
    status:
      - 401
      - 422
    description: The TOTP or recovery code is wrong, already used, or outside its window. 401 on the login challenge, 422 when confirming an enrolment.
  mfa-challenge-expired:
    status:
      - 401
    description: The MFA challenge from login is expired or already consumed; sign in again.
  session-expired:
    status:
      - 401
    description: The session hit its idle or absolute timeout, or was revoked; sign in again.
  forbidden:
    status:
      - 403
    description: Authenticated, but the principal lacks the required permission (or the request needs a browser session).
  csrf-invalid:
    status:
      - 403
    description: A cookie-authenticated mutation is missing a valid X-CSRF-Token.
  mfa-enrolment-required:
    status:
      - 403
    description: The tenant requires MFA and the user has not enrolled; only enrolment endpoints and logout work until then.
  mfa-required-by-policy:
    status:
      - 403
    description: The action (disabling MFA) is not allowed because tenant policy enforces MFA for this user.
  reauth-failed:
    status:
      - 403
    description: The password or TOTP code sent to re-authenticate a sensitive action is wrong.
  not-found:
    status:
      - 404
    description: The resource does not exist, belongs to another tenant, or is outside the caller's scope.
  token-invalid:
    status:
      - 404
    description: "The password-reset token is unknown or already used. Also: a local-storage file link (`/v1/files/{token}`) that is malformed, forged or of the wrong kind."
  invitation-not-found:
    status:
      - 404
    description: The invitation token is unknown, already accepted or revoked.
  method-not-allowed:
    status:
      - 405
    description: The path exists but not for this HTTP method.
  conflict:
    status:
      - 409
    description: "State conflict: uniqueness violation, or the resource is in the wrong state for this action."
  idempotency-key-in-flight:
    status:
      - 409
    description: A request with the same Idempotency-Key is still running.
  cannot-revoke-current:
    status:
      - 409
    description: The current session cannot be revoked here; use sign out.
  mfa-already-enrolled:
    status:
      - 409
    description: The user already has an active TOTP factor; disable it first.
  asset-already-checked-out:
    status:
      - 409
    description: The asset is already checked out.
  asset-not-checked-out:
    status:
      - 409
    description: The asset has no open check-out to return.
  person-already-linked:
    status:
      - 409
    description: The person is already linked to a login account (the same or another one). Unlink it first.
  login-already-linked:
    status:
      - 409
    description: The login account is already linked to a person that somebody chose (not the placeholder the system made for it). Unlink that person first.
  login-person-in-use:
    status:
      - 409
    description: "The login account's own person record still holds assets, so it cannot be replaced by the person being linked: check them in or transfer them first (`usage.open_assignments`)."
  undo-expired:
    status:
      - 409
    description: More than five minutes have passed since the custody action, so it can no longer be undone.
  undo-asset-changed:
    status:
      - 409
    description: The asset changed after the action (another custody action, an edit, a move...), so it can no longer be undone.
  undo-not-possible:
    status:
      - 409
    description: "The action cannot be undone: it was already undone, the previous holder or status is no longer available, or it is loaner custody."
  asset-not-deployable:
    status:
      - 409
    description: "The asset's status does not allow this custody action: check-out (and a transfer out of stock) need a `deployable` state, so lost, archived, in-repair and pending assets cannot be checked out."
  insufficient-stock:
    status:
      - 409
    description: Not enough quantity on hand.
  no-loaner-available:
    status:
      - 409
    description: The loaner pool has no available member.
  import-stale-dry-run:
    status:
      - 409
    description: "The dry run being committed is not the one reviewed: the file, mapping, options or value mapping changed after it, or a newer dry run exists."
  import-wrong-state:
    status:
      - 409
    description: The import is not in a state that allows this action (for example a commit before a dry run, or editing a running import). `state` and `allowed` say which.
  import-quota-exceeded:
    status:
      - 429
    description: The organisation already runs the maximum number of imports at once; retry after the time in `Retry-After`.
  loan-limit-reached:
    status:
      - 409
    description: The borrower already holds the most open loans the pool allows (`max_loans_per_person`).
  loaner-pool-inactive:
    status:
      - 409
    description: "The loaner pool is switched off (`is_active = false`): it lends nothing until it is switched on again."
  upload-missing:
    status:
      - 409
    description: "The upload was not found in object storage: PUT the bytes to the presigned URL before calling complete."
  token-expired:
    status:
      - 410
    description: "The password-reset token has expired; request a new one. Also: a local-storage file link (`/v1/files/{token}`) whose lifetime ended."
  invitation-expired:
    status:
      - 410
    description: The invitation has expired; ask an administrator to resend it.
  precondition-failed:
    status:
      - 412
    description: "`If-Match` does not match the current version."
  payload-too-large:
    status:
      - 413
    description: "The request body exceeds the size limit. For attachments: the file is larger than the organisation's upload cap (see `GET /v1/settings/files`) or than the size declared when the upload was started."
  unsupported-media-type:
    status:
      - 415
    description: "The Content-Type is not supported. For attachments: the file type is not on the allow-list (images, PDF, Office documents, CSV; never SVG or HTML), or its content does not match the declared type or extension."
  validation:
    status:
      - 422
    description: Validation failed; see errors[] (JSON pointer + message + field code).
  idempotency-key-reuse:
    status:
      - 422
    description: The Idempotency-Key was already used with a different request body.
  precondition-required:
    status:
      - 428
    description: "`If-Match` is required for this operation."
  account-locked:
    status:
      - 429
    description: Too many failed sign-in or re-authentication attempts; locked until Retry-After elapses.
  too-many-requests:
    status:
      - 429
    description: Rate limit exceeded; wait for Retry-After.
  internal:
    status:
      - 500
    description: Unexpected server error; quote request_id.
  unavailable:
    status:
      - 503
    description: A dependency is down or the service is starting.
