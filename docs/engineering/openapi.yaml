openapi: 3.1.0
info:
  title: Asset Tracker API
  version: 1.0.0-m2
  summary: REST API for the Asset Tracker (milestones M1 and M2).
  description: |-
    Asset Tracker REST API, milestones **M1** (tenancy, users, auth, asset registry, audit log, attachments) and **M2** (locations, people, check-out/in, transfers, accessories, consumables, loaner pools, repairs, labels, imports).

    ## Authentication
    - **Browser / web app:** server-side session in the `__Host-at_session` cookie (HttpOnly, Secure, SameSite=Lax). Mutating requests made with the cookie must send the `X-CSRF-Token` header (value returned by login and `GET /v1/auth/me`).
    - **Integrations / scripts / mobile:** `Authorization: Bearer <api key>`. Keys are scoped (`resource:action`), can expire and are stored hashed. A key can never exceed the permissions of the role that created it.
    - The tenant is derived **only** from the credential, never from a header or body field. A resource id that belongs to another tenant returns `404`, exactly like a missing id.
    - **Session lifetime:** every cookie session has an idle timeout and an absolute timeout (`GET /v1/auth/me` returns `session.idle_expires_at` and `session.absolute_expires_at`). A request on an expired or revoked session returns `401` with code `session-expired`.
    - **Unauthenticated endpoints** (login, MFA verify, password forgot/reset, password policy, invitation lookup/accept) take no cookie and no CSRF header, and are throttled per IP and per account (`429`, `Retry-After`). Invitation accept and password reset tokens are single-use and stored hashed.

    ## Account security
    - **Password policy:** minimum 12 and maximum 128 characters, no composition rules, Unicode NFKC-normalised, and a breached-password check (bundled offline list always on; an optional online k-anonymity provider can be enabled). A rejected password returns `422` with an `errors[]` entry at pointer `/password` (code `too-short`, `too-long` or `breached`). Clients read the live limits from `GET /v1/auth/password-policy` instead of hardcoding them (schema `PasswordPolicy`).
    - **MFA enrolment enforcement:** when the tenant requires MFA for the user's role and the user has not enrolled, the session is *limited*: `GET /v1/auth/me` returns `mfa_enrolment_required: true` and every other endpoint except `/v1/auth/logout` and `/v1/auth/mfa/enrol*` answers `403` with code `mfa-enrolment-required`. Completing `POST /v1/auth/mfa/enrol/confirm` lifts the limit.
    - **Re-authentication:** regenerating recovery codes and disabling MFA need the current password or a current TOTP code in the body (`ReauthRequest`); a wrong value returns `403` `reauth-failed` (never `401`, which clients treat as "session gone").
    - **Self-service endpoints** (`/v1/auth/sessions`, `/v1/auth/mfa/*`) need a browser session, not an API key, and no permission beyond being signed in (marked `x-self-service: true`).

    ## Permissions
    Each operation lists the permission it needs in `x-permission` (`resource:action`). Built-in roles: `tenant_admin` (`*`), `asset_manager`, `technician`, `auditor`, `viewer`. Role assignments can be scoped to the tenant, a company or a location subtree; reads and writes outside the scope behave as `404`.

    ## Idempotency
    Every mutating request (POST, PATCH, DELETE) accepts an `Idempotency-Key` header (8-255 chars, client-generated, unique per principal). It is **required** on check-out, check-in, transfer, loaner check-out, stock movements and import commit. A retry with the same key and the same body replays the stored response and sets `Idempotent-Replayed: true`; the same key with a different body returns `422` (`idempotency-key-reuse`); a retry while the first request is still running returns `409` (`idempotency-key-in-flight`). Keys expire after 24 hours.

    ## Optimistic concurrency
    Single-resource GET and every create/update response carry an `ETag` (`W/"<version>"`). `PATCH` and `DELETE` require `If-Match` (`428` if missing, `412` if stale). Check-out, check-in and transfer accept `If-Match` on the asset but also serialise server-side, so a lost race returns `409`. Their responses return the **updated asset** (body and `ETag`) together with the assignment (and the transfer record), so a client can chain the next call without a re-fetch.

    ## Pagination, sorting, filtering
    List endpoints use **cursor pagination**: `limit` (1-200, default 50) and an opaque `cursor`; the response carries `page.next_cursor` and `page.has_more`. `page.total` is only returned with `include_total=true` (it costs a count). Cursors are bound to the `sort` and filters that produced them. `sort` is a comma-separated list, `-` prefix for descending. Filters are plain query parameters; array filters are comma-separated; custom fields filter with `cf[<key>]=<value>`.

    ## Errors
    Errors are RFC 9457 `application/problem+json` with a stable machine `code`, the `request_id` (also in the `X-Request-Id` header) and, for validation failures, an `errors[]` array of JSON-pointer + message. The catalogue of codes is the `x-problem-codes` extension at the root of this document (code, HTTP status, meaning) and the `ProblemCode` schema; every error response lists the codes it can carry in its own `x-problem-codes` array. The set grows over time: clients must branch on `code` for the ones they know and fall back to the HTTP status for the rest.

    ## Rate limits
    Per tenant by plan tier. Responses carry `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`; `429` adds `Retry-After`.

    ## Money and dates
    Money is `{ amount_minor, currency }` (integer minor units, ISO 4217). Timestamps are RFC 3339 UTC; dates are `YYYY-MM-DD`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Asset Tracker engineering
servers:
  - url: https://{host}
    description: Cloud edition or a self-hosted install
    variables:
      host:
        default: api.assettracker.test
        description: API host. Paths already include the /v1 prefix.
security:
  - sessionCookie: []
  - bearerApiKey: []
tags:
  - name: Auth
    description: Login, MFA enrolment and verification, password reset, invitation acceptance, browser sessions, password policy and the current principal.
  - name: System
    description: Liveness/health and build version; no credential needed.
  - name: Search
    description: Global search across registry entities, filtered by the caller's permissions.
  - name: Access
    description: Users, roles, companies and API keys.
  - name: Assets
    description: "The asset registry: CRUD, search, scan resolution and history."
  - name: Custody
    description: Check-out, check-in and transfer of assets.
  - name: Categories
    description: Asset, accessory and consumable categories.
  - name: Manufacturers
    description: Manufacturer catalogue.
  - name: Models
    description: Asset models (make/model templates).
  - name: Custom fields
    description: Custom field definitions; values live in `asset.custom_data`.
  - name: Status labels
    description: Configurable status labels mapped to fixed state types.
  - name: Vendors
    description: Suppliers and repair vendors.
  - name: Locations
    description: Hierarchical locations.
  - name: People
    description: Assignable people (employees, students, contractors), with or without a login.
  - name: Departments
    description: "Managed departments (ED-17): the list people and assets are assigned to, instead of free text."
  - name: Accessories
    description: Quantity-tracked items that are checked out and returned.
  - name: Consumables
    description: Quantity-tracked items that are used up, with a stock ledger.
  - name: Loaners
    description: "Loaner pools: spare devices with quick check-out, due dates and overdue tracking."
  - name: Repairs
    description: Repair and maintenance log.
  - name: Labels
    description: Fixed label templates and PDF label sheets.
  - name: Imports
    description: CSV/XLSX imports (assets, people, locations, departments; Google Admin ChromeOS preset) with a mandatory dry run.
  - name: Attachments
    description: File metadata and presigned upload/download.
  - name: Audit
    description: Append-only audit log.
  - name: Notifications
    description: In-app notifications, per-user delivery preferences, tenant notification rules and the delivery log.
  - name: Views
    description: Saved list views (filters, columns, sort), private or shared tenant-wide.
  - name: Exports
    description: CSV exports of lists, produced by a background job and downloaded through a short-lived link.
paths:
  /v1/accessories:
    get:
      tags:
        - Accessories
      operationId: listAccessories
      summary: List accessories
      description: |-
        Cursor-paginated list.

        Requires permission `accessory:read`.
      x-permission: accessory:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTotal"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Archived"
        - name: category_id
          in: query
          description: Filter by category.
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          description: Filter by location.
          schema:
            type: string
            format: uuid
        - name: low_stock
          in: query
          description: true = only accessories with `min_qty > 0` and `qty_available <= min_qty`; false = all the others.
          schema:
            type: boolean
        - name: sort
          in: query
          style: form
          explode: false
          description: "Comma-separated sort keys, `-` prefix = descending. Allowed: name, qty_total, created_at. A unique tiebreaker (`id`) is always appended."
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - -name
                - qty_total
                - -qty_total
                - created_at
                - -created_at
            default:
              - name
      responses:
        "200":
          description: A page of results.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Accessories
      operationId: createAccessory
      summary: Create accessory
      description: Requires permission `accessory:manage`.
      x-permission: accessory:manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessoryCreate"
      responses:
        "201":
          description: Accessory created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accessory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accessories/{id}:
    get:
      tags:
        - Accessories
      operationId: getAccessory
      summary: Get accessory
      description: Requires permission `accessory:read`.
      x-permission: accessory:read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The accessory.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accessory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Accessories
      operationId: updateAccessory
      summary: Update accessory
      description: Requires permission `accessory:manage`.
      x-permission: accessory:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessoryUpdate"
      responses:
        "200":
          description: Updated accessory.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accessory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The new `qty_total` is below the units that are checked out (`insufficient-stock`), or another uniqueness conflict. Codes: `insufficient-stock`, `conflict`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/insufficient-stock
                title: insufficient stock
                status: 409
                code: insufficient-stock
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - insufficient-stock
            - conflict
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Accessories
      operationId: archiveAccessory
      summary: Archive accessory
      description: |-
        Soft delete (`archived_at`). Fails with 409 while the record is still referenced by active records where that would break integrity.

        Requires permission `accessory:manage`.
      x-permission: accessory:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Archived.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Units are still checked out (`usage.open_assignments`); return them first. Codes: `conflict`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/conflict
                title: conflict
                status: 409
                code: conflict
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - conflict
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accessories/{id}/assignments:
    get:
      tags:
        - Accessories
      operationId: listAccessoryAssignments
      summary: Who holds this accessory
      description: |-
        Newest first. Each row carries `quantity`, `quantity_returned` and `target_name`.

        Requires permission `accessory:read`.
      x-permission: accessory:read
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          description: Defaults to `open`.
          schema:
            type: string
            enum:
              - open
              - closed
              - all
      responses:
        "200":
          description: A page of assignments.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accessories/{id}/checkin:
    post:
      tags:
        - Accessories
      operationId: checkinAccessory
      summary: Return accessory units
      description: |-
        Returns `quantity` units (default: everything still outstanding) of an open assignment. A partial return increases `quantity_returned` on the same assignment, which stays open; the return that completes it sets `checked_in_at`. The returned units are available again immediately. Returning more than the outstanding units is rejected with 422.

        Requires permission `accessory:checkout`.
      x-permission: accessory:checkout
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessoryCheckinRequest"
      responses:
        "200":
          description: "The assignment after the return: still open with a higher `quantity_returned` after a partial return, closed (`checked_in_at` set) after the last units come back."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The assignment is already fully returned, or a request with the same Idempotency-Key is still running. Codes: `conflict`, `idempotency-key-in-flight`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/conflict
                title: conflict
                status: 409
                code: conflict
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - conflict
            - idempotency-key-in-flight
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accessories/{id}/checkout:
    post:
      tags:
        - Accessories
      operationId: checkoutAccessory
      summary: Check out accessory units
      description: |-
        Hands `quantity` units (default 1) to a person, a location or an asset: one assignment row with `quantity` and `quantity_returned = 0`. Fails with 409 `insufficient-stock` if the quantity exceeds what is available (`qty_total` minus the units still outstanding on open assignments); concurrent check-outs are serialised on the accessory, so the stock is never exceeded. The person must be active, the location and target asset live. Writes an audit record and the outbox event `accessory.checked_out` in the same transaction; when the check-out brings `qty_available` to or below `min_qty` the outbox event `accessory.low_stock` is emitted once per crossing.

        Requires permission `accessory:checkout`.
      x-permission: accessory:checkout
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessoryCheckoutRequest"
            example:
              person_id: 0197a3c2-1b6e-7c3a-8d41-2f5b6a7c8d91
              quantity: 2
              note: Two chargers for the new starter
      responses:
        "201":
          description: Checked out.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Not enough units available (`insufficient-stock`), the accessory is archived, or a request with the same Idempotency-Key is still running. Codes: `insufficient-stock`, `conflict`, `idempotency-key-in-flight`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.assettracker.test/problems/insufficient-stock
                title: insufficient stock
                status: 409
                code: insufficient-stock
                request_id: 01JABCDEF0123456789
          x-problem-codes:
            - insufficient-stock
            - conflict
            - idempotency-key-in-flight
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/api-keys:
    get:
      tags:
        - Access
      operationId: listApiKeys
      summary: List API keys
      description: Requires permission `apikey:manage`.
      x-permission: apikey:manage
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTotal"
      responses:
        "200":
          description: A page of API keys (secrets are never returned).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Access
      operationId: createApiKey
      summary: Create an API key
      description: |-
        The secret is returned **once** in this response. Scopes must be a subset of the caller's own permissions.

        Requires permission `apikey:manage`.
      x-permission: apikey:manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
