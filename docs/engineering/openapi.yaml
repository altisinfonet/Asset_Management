    ImportOptions:
      type: object
      properties:
        match_on:
          type: string
          enum:
            - auto
            - asset_tag
            - serial
            - external_id
          default: auto
          description: "Assets: how an existing asset is found. `auto` = the tag when the row has one, else the serial number (a tag and a serial that name different assets is a row error)."
        on_match:
          type: string
          enum:
            - skip
            - update
            - error
          default: skip
          description: "What to do with a row whose record exists already, and with a row that repeats an earlier row of the file (same tag, serial, email, path or name): leave it, update it with the cells of the file, or report an error."
        blank_cells:
          type: string
          enum:
            - ignore
            - clear
          default: ignore
          description: "Update only: an empty cell leaves the field alone, or empties it."
        date_format:
          type: string
          enum:
            - auto
            - iso
            - dmy
            - mdy
          default: auto
          description: "`auto` reads ISO dates, month names and unambiguous day/month dates; `03/04/2024` needs `dmy` or `mdy`."
        number_format:
          type: string
          enum:
            - auto
            - dot
            - comma
          default: auto
          description: The decimal separator of numbers in the file; `auto` decides where the text is unambiguous (`1.234,50`, `1,234.50`) and reads `1,234` as a thousand.
        default_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency of costs that name none; else the organisation's base currency.
        external_source:
          type: string
          maxLength: 100
          description: Source recorded with a mapped external id (default `import`; the Google preset uses `google_admin`).
        references:
          type: object
          additionalProperties:
            type: string
            enum:
              - create
              - must_exist
          description: "Per reference kind (`category`, `manufacturer`, `model`, `status`, `location`, `department`, `vendor`, `person`): create what is missing, or require it to exist. Defaults: `create`, except `status` and `person` (`must_exist`; a status label is never created)."
        defaults:
          type: object
          properties:
            category:
              type: string
              format: uuid
            status:
              type: string
              format: uuid
            location:
              type: string
              format: uuid
            department:
              type: string
              format: uuid
            vendor:
              type: string
              format: uuid
          additionalProperties: false
          description: Ids used when a row's own cell is empty.
        location_kind:
          type: string
          enum:
            - site
            - building
            - floor
            - room
            - storage
            - vehicle
            - other
          default: other
          description: Kind of the locations the import creates.
        assign:
          type: boolean
          default: true
          description: "Assets: check an asset out to the person in `assigned_to` (only when it can be checked out; otherwise a warning)."
        detect_changes:
          type: boolean
          default: true
          description: "Update only: a record edited after the dry run is not touched (row error `changed-since-dry-run`)."
      additionalProperties: false
    ImportMappingColumn:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 499
          description: 0-based column of the file.
        target:
          type:
            - string
            - "null"
          maxLength: 80
          description: A field of the entity (`GET /v1/imports/presets` lists them), `cf:<custom field key>` for an asset custom field, or null to ignore the column.
        date_format:
          type: string
          enum:
            - auto
            - iso
            - dmy
            - mdy
          description: Overrides the job's date format for this column.
      required:
        - index
        - target
      additionalProperties: false
    ImportMapping:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ImportMappingColumn"
        constants:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 300
          description: 'Text for a target that has no column (`{"category": "Chromebook"}`), used for every row whose own cell is empty.'
      required:
        - columns
      additionalProperties: false
    ImportValueEntry:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
          required:
            - id
          additionalProperties: false
          description: Use this existing record.
        - type: object
          properties:
            create:
              const: true
            name:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - create
          additionalProperties: false
          description: Create it (under this name, default the text of the cell).
        - type: object
          properties:
            skip:
              const: true
          required:
            - skip
          additionalProperties: false
          description: Treat the cell as empty.
    ImportValueMap:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          $ref: "#/components/schemas/ImportValueEntry"
      description: "By reference kind, then by the NORMALISED source value (trimmed, spaces collapsed, lower case): what that value of the file means."
    ImportParse:
      type: object
      properties:
        format:
          type:
            - string
            - "null"
          description: "`csv` or `xlsx`."
        encoding:
          type:
            - string
            - "null"
          description: "CSV: `utf-8`, `utf-16le`, `utf-16be` or `windows-1252` (detected)."
        delimiter:
          type:
            - string
            - "null"
          description: "CSV: `,` `;` tab or `|` (detected)."
        sheet:
          type:
            - string
            - "null"
          description: "XLSX: the sheet that is read (default: the first visible one)."
        sheets:
          type:
            - array
            - "null"
          items:
            type: string
          description: "XLSX: the visible sheets."
        header_line:
          type:
            - integer
            - "null"
          description: Row (XLSX) or line (CSV) number of the header row.
      required:
        - format
        - encoding
        - delimiter
        - sheet
        - sheets
        - header_line
    ImportColumnProfile:
      type: object
      properties:
        index:
          type: integer
        header:
          type: string
        non_blank:
          type: integer
        blank:
          type: integer
        distinct:
          type: integer
        distinct_capped:
          type: boolean
          description: "More than 10,000 distinct values: `distinct` is a lower bound."
        duplicates:
          type: integer
          description: Non-blank cells that repeat an earlier value.
        type:
          type: string
          enum:
            - empty
            - integer
            - number
            - date
            - boolean
            - email
            - text
        date_order:
          type:
            - string
            - "null"
          enum:
            - iso
            - dmy
            - mdy
            - ambiguous
            - mixed
            - null
          description: "Date columns: the order the data allows; `ambiguous` needs an explicit date format."
        max_length:
          type: integer
        samples:
          type: array
          items:
            type: string
          description: Up to five distinct values.
      required:
        - index
        - header
        - non_blank
        - blank
        - distinct
        - distinct_capped
        - duplicates
        - type
        - date_order
        - max_length
        - samples
    RowIssue:
      type: object
      properties:
        field:
          type:
            - string
            - "null"
          description: The target field the problem belongs to (`serial`, `cf:os_version`), or null for the row as a whole.
        message:
          type: string
        code:
          type: string
          description: "Stable code: `required`, `not-found`, `ambiguous-date`, `number`, `exists`, `duplicate-in-file`, `changed-since-dry-run`, `will-create`, `unchanged`..."
      required:
        - field
        - message
        - code
    ImportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum:
            - asset
            - person
            - location
            - department
        source:
          type: string
          enum:
            - csv
            - xlsx
            - google_admin_csv
        preset_key:
          type:
            - string
            - "null"
          description: The built-in preset the import was created from (`GET /v1/imports/presets`).
        state:
          type: string
          enum:
            - draft
            - uploaded
            - analyzing
            - analyzed
            - mapped
            - dry_running
            - dry_run_done
            - committing
            - completed
            - failed
            - cancelled
          description: draft (no file yet) -> uploaded -> analyzing -> analyzed -> mapped -> dry_running -> dry_run_done -> committing -> completed; `failed` and `cancelled` end it. Editing the mapping or options returns `dry_run_done` to `mapped`.
        filename:
          type:
            - string
            - "null"
        file_attachment_id:
          type:
            - string
            - "null"
          format: uuid
          description: "The uploaded file: an attachment of kind `import_file` owned by this import."
        parse:
          $ref: "#/components/schemas/ImportParse"
        headers:
          type:
            - array
            - "null"
          items:
            type: string
          description: Header names of the file, after analysis.
        mapping:
          $ref: "#/components/schemas/ImportMapping"
        options:
          $ref: "#/components/schemas/ImportOptions"
        rows_total:
          type: integer
          description: Data rows of the file.
        counts:
          type: object
          properties:
            dry_run:
              type: object
              properties:
                create:
                  type: integer
                update:
                  type: integer
                skip:
                  type: integer
                error:
                  type: integer
              required:
                - create
                - update
                - skip
                - error
            commit:
              type: object
              properties:
                created:
                  type: integer
                updated:
                  type: integer
                skipped:
                  type: integer
                error:
                  type: integer
              required:
                - created
                - updated
                - skipped
                - error
          required:
            - dry_run
            - commit
        progress:
          type: object
          properties:
            phase:
              type:
                - string
                - "null"
              enum:
                - analyze
                - dry_run
                - commit
                - null
            processed:
              type: integer
            total:
              type: integer
            percent:
              type: integer
              minimum: 0
              maximum: 100
          required:
            - phase
            - processed
            - total
            - percent
        dry_run_digest:
          type:
            - string
            - "null"
          description: Digest of the reviewed dry run (file, parse settings, mapping, options, value map and every row's outcome). Quote it in the commit request.
        dry_run_at:
          type:
            - string
            - "null"
          format: date-time
        committed_at:
          type:
            - string
            - "null"
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        cancel_requested:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: Why a failed import failed (a sentence; for a bad file it names the line).
        summary:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "After a dry run: `counts`, `errors_by_code` and `will_create` (references the commit would create, with counts). On a preset import: `setup` (what creating the import created)."
        requested_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        profile:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ImportColumnProfile"
          description: Per-column statistics (only on a single import, not in lists). Without `import:run` the `samples` of each column are empty.
        samples:
          type:
            - array
            - "null"
          items:
            type: array
            items:
              type: string
          description: "The first 50 data rows (only on a single import; null without `import:run`: they are cells of the file)."
        confidence:
          type:
            - object
            - "null"
          additionalProperties:
            type: number
          description: How sure the suggested mapping is per column index (1 = exact header match).
        value_map:
          $ref: "#/components/schemas/ImportValueMap"
          description: Empty without `import:run` (its keys are values of the file).
      required:
        - id
        - entity_type
        - source
        - preset_key
        - state
        - filename
        - file_attachment_id
        - parse
        - headers
        - mapping
        - options
        - rows_total
        - counts
        - progress
        - dry_run_digest
        - dry_run_at
        - committed_at
        - started_at
        - finished_at
        - cancel_requested
        - error
        - summary
        - requested_by
        - created_at
        - updated_at
    ImportList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImportJob"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    ImportCreate:
      type: object
      properties:
        entity_type:
          type: string
          enum:
            - asset
            - person
            - location
            - department
        preset_key:
          type: string
          minLength: 1
          maxLength: 64
          description: A built-in preset of the same entity type. `google_admin_chromeos` creates the Chromebook category and its custom fields when they do not exist (needs `catalog:manage` then).
        options:
          $ref: "#/components/schemas/ImportOptions"
      required:
        - entity_type
      additionalProperties: false
    ImportUpdate:
      type: object
      properties:
        mapping:
          $ref: "#/components/schemas/ImportMapping"
        options:
          $ref: "#/components/schemas/ImportOptions"
          description: Only the options to change; `references` and `defaults` are merged by key.
        value_map:
          $ref: "#/components/schemas/ImportValueMap"
          description: Replaces the entries of each reference kind given (send `{}` for a kind to clear it).
      additionalProperties: false
      description: Any change returns a `dry_run_done` import to `mapped` and invalidates the digest. Allowed in `draft`, `uploaded`, `analyzed`, `mapped` and `dry_run_done`.
    ImportAnalyze:
      type: object
      properties:
        file_attachment_id:
          type: string
          format: uuid
          description: Attachment of kind `import_file` owned by this import, uploaded and completed. Omit to analyse the file again.
        parse:
          type: object
          properties:
            encoding:
              type: string
              enum:
                - utf-8
                - utf-16le
                - utf-16be
                - windows-1252
            delimiter:
              type: string
              enum:
                - ","
                - ;
                - "\t"
                - "|"
            sheet:
              type: string
              minLength: 1
              maxLength: 100
            header_line:
              type: integer
              minimum: 1
              maximum: 100000
          additionalProperties: false
          description: Overrides of what the analysis detects.
      additionalProperties: false
    ImportCommit:
      type: object
      properties:
        dry_run_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The `dry_run_digest` of the dry run the user reviewed.
      required:
        - dry_run_digest
      additionalProperties: false
    ImportRow:
      type: object
      properties:
        row_no:
          type: integer
          minimum: 1
          description: Position among the data rows.
        line_no:
          type: integer
          minimum: 1
          description: Line (CSV) or row (XLSX) of the file; shown in error messages.
        phase:
          type: string
          enum:
            - dry_run
            - commit
        outcome:
          type:
            - string
            - "null"
          description: "Dry run: `create` / `update` / `skip` / `error`. Commit: `created` / `updated` / `skipped` / `error`."
        plan:
          type:
            - string
            - "null"
          enum:
            - create
            - update
            - skip
            - error
            - null
        result:
          type:
            - string
            - "null"
          enum:
            - created
            - updated
            - skipped
            - error
            - null
        entity_id:
          type:
            - string
            - "null"
          format: uuid
          description: The existing record an update changes.
        created_id:
          type:
            - string
            - "null"
          format: uuid
          description: The record the commit created.
        duplicate_of:
          type:
            - integer
            - "null"
          description: Row number of the first row of the file with the same key.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/RowIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RowIssue"
        source:
          type: object
          additionalProperties:
            type: string
