        mapped:
          type:
            - object
            - "null"
          additionalProperties: true
          description: The typed record the mapping produced (`f` fields, `r` references, `c` custom fields).
        before_image:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "Commit of an update: the values it replaced (kept for import undo, v1.1)."
      required:
        - row_no
        - line_no
        - phase
        - outcome
        - plan
        - result
        - entity_id
        - created_id
        - duplicate_of
        - errors
        - warnings
        - source
        - mapped
        - before_image
