              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/users/{id}/mfa:
    delete:
      tags:
        - Access
      operationId: resetUserMfa
      summary: Reset a user's MFA
      description: |-
        For a user who lost their device and recovery codes: removes all MFA factors and recovery codes and revokes all their sessions. If tenant policy requires MFA the user must enrol again at the next sign-in. You cannot reset your own MFA this way (`409 conflict`; use `DELETE /v1/auth/mfa`). Audited.

        Requires permission `user:manage`.
      x-permission: user:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: MFA reset.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/users/{id}/sessions:
    get:
      tags:
        - Access
      operationId: listUserSessions
      summary: List a user's active sessions
      description: |-
        Administrator view of the same device list as `GET /v1/auth/sessions` (`current` is always false). Not paginated.

        Requires permission `user:manage`.
      x-permission: user:manage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Active sessions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/users/{id}/sessions/{session_id}:
    delete:
      tags:
        - Access
      operationId: revokeUserSession
      summary: Revoke one session of a user
      description: |-
        Revokes a single session of another user (the user's whole set is also revoked by role change, deactivation and password reset). Audited.

        Requires permission `user:manage`.
      x-permission: user:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: session_id
          in: path
          required: true
          description: Session id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/vendors:
    get:
      tags:
        - Vendors
      operationId: listVendors
      summary: List vendors
      description: |-
        Cursor-paginated list.

        Requires permission `catalog:read`.
      x-permission: catalog:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTotal"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Archived"
        - name: sort
          in: query
          style: form
          explode: false
          description: "Comma-separated sort keys, `-` prefix = descending. Allowed: name, created_at. A unique tiebreaker (`id`) is always appended."
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - -name
                - created_at
                - -created_at
            default:
              - name
      responses:
        "200":
          description: A page of results.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Vendors
      operationId: createVendor
      summary: Create vendor
      description: Requires permission `catalog:manage`.
      x-permission: catalog:manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreate"
      responses:
        "201":
          description: Vendor created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/vendors/{id}:
    get:
      tags:
        - Vendors
      operationId: getVendor
      summary: Get vendor
      description: Requires permission `catalog:read`.
      x-permission: catalog:read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The vendor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Vendors
      operationId: updateVendor
      summary: Update vendor
      description: Requires permission `catalog:manage`.
      x-permission: catalog:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated vendor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Vendors
      operationId: archiveVendor
      summary: Archive vendor
      description: |-
        Soft delete (`archived_at`). Fails with 409 while the record is still referenced by active records where that would break integrity.

        Requires permission `catalog:manage`.
      x-permission: catalog:manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Archived.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-at_session
      description: Browser session cookie issued by `POST /v1/auth/login`. Mutations also need the `X-CSRF-Token` header.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: at_<prefix>.<secret>
      description: "Scoped API key (also used by the mobile app after login). Send as `Authorization: Bearer <key>`."
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource id (UUIDv7).
      schema:
        type: string
        format: uuid
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      description: Asset id.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `page.next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IncludeTotal:
      name: include_total
      in: query
      description: Also return `page.total` (an extra count query; avoid on large lists).
      schema:
        type: boolean
        default: false
    Archived:
      name: archived
      in: query
      description: "Archived (soft-deleted) records: `exclude` (default), `include` or `only`."
      schema:
        type: string
        enum:
          - exclude
          - include
          - only
        default: exclude
    Q:
      name: q
      in: query
      description: Free-text search (trigram / prefix match).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key making the request safely retryable (8-255 chars). Optional here; recommended for mobile and scripts.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (8-255 chars) so the operation can be retried without being applied twice. Required.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified. `428` if absent, `412` if stale.
      schema:
        type: string
        examples:
          - W/"7"
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: ETag of the asset the client acted on; if it changed, the request fails with `412` and the client should refresh.
      schema:
        type: string
        examples:
          - W/"7"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for mutating requests authenticated with the session cookie; ignored for API keys.
      schema:
        type: string
  headers:
    ETag:
      description: Weak entity tag of the resource version, `W/"<version>"`. Send it back in `If-Match`.
      schema:
        type: string
        examples:
          - W/"7"
    Location:
      description: URL of the created or queued resource.
      schema:
        type: string
        format: uri-reference
    RequestId:
      description: Server-generated request id; quote it in support requests.
      schema:
        type: string
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplayed:
      description: "`true` when the response is a replay of an earlier request with the same Idempotency-Key."
      schema:
        type: boolean
    SetCookie:
      description: Session cookie `__Host-at_session`.
      schema:
        type: string
  responses:
    BadRequest:
      description: "Malformed request (bad JSON, bad query parameter, invalid cursor). Codes: `bad-request`, `idempotency-key-required`, `idempotency-key-invalid`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.assettracker.test/problems/bad-request
            title: Bad request
            status: 400
            code: bad-request
            detail: Query parameter "limit" must be between 1 and 200.
            request_id: 01JABCDEF0123456789
      x-problem-codes:
        - bad-request
        - idempotency-key-required
        - idempotency-key-invalid
    Unauthorized:
      description: "Missing, invalid or expired credentials. Codes: `unauthorized`, `session-expired`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          description: Authentication scheme.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - unauthorized
        - session-expired
    Forbidden:
      description: "Authenticated, but the principal lacks the required permission (or MFA enrolment is required). Codes: `forbidden`, `csrf-invalid`, `mfa-enrolment-required`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - forbidden
        - csrf-invalid
        - mfa-enrolment-required
    NotFound:
      description: "The resource does not exist **or belongs to another tenant or is outside the caller's scope**. Codes: `not-found`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - not-found
    Conflict:
      description: "State conflict: uniqueness violation, asset already checked out, insufficient stock, or an Idempotency-Key request still in flight. Codes: `conflict`, `idempotency-key-in-flight`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - conflict
        - idempotency-key-in-flight
    PreconditionFailed:
      description: "`If-Match` does not match the current version; re-read and retry. Codes: `precondition-failed`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - precondition-failed
    PreconditionRequired:
      description: "`If-Match` header is required for this operation. Codes: `precondition-required`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - precondition-required
    Unprocessable:
      description: "Validation failed (see `errors[]`), or an Idempotency-Key was reused with a different body. Codes: `validation`, `idempotency-key-reuse`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.assettracker.test/problems/validation
            title: Validation failed
            status: 422
            code: validation
            errors:
              - pointer: /asset_tag
                message: must not contain whitespace
                code: pattern
            request_id: 01JABCDEF0123456789
      x-problem-codes:
        - validation
        - idempotency-key-reuse
    TooManyRequests:
      description: "Rate limit exceeded. Codes: `too-many-requests`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      x-problem-codes:
        - too-many-requests
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ProblemCode"
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
      required:
        - type
        - title
        - status
      description: RFC 9457 problem details.
    ProblemCode:
      type: string
      description: "Stable machine-readable problem code. The set is open (new codes may appear): branch on codes you know and fall back to the HTTP status. The full catalogue (code, HTTP status, meaning) is the root `x-problem-codes` extension of this document; each error response lists its own subset in `x-problem-codes`."
      examples:
        - validation
        - invalid-credentials
        - mfa-enrolment-required
        - asset-already-checked-out
      x-known-values:
        - bad-request
        - idempotency-key-required
        - idempotency-key-invalid
        - unauthorized
        - invalid-credentials
        - mfa-invalid-code
        - mfa-challenge-expired
        - session-expired
        - forbidden
        - csrf-invalid
        - mfa-enrolment-required
        - mfa-required-by-policy
        - reauth-failed
        - not-found
        - token-invalid
        - invitation-not-found
        - method-not-allowed
        - conflict
        - idempotency-key-in-flight
        - cannot-revoke-current
        - mfa-already-enrolled
        - asset-already-checked-out
        - asset-not-checked-out
        - insufficient-stock
        - no-loaner-available
        - import-stale-dry-run
        - token-expired
        - invitation-expired
        - precondition-failed
        - payload-too-large
        - unsupported-media-type
        - validation
        - idempotency-key-reuse
        - precondition-required
        - account-locked
        - too-many-requests
        - internal
        - unavailable
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON pointer into the request body, or `query:<name>`.
        message:
          type: string
        code:
          type: string
          description: Per-field code, e.g. `pattern`, `required`; for passwords `too-short`, `too-long`, `breached`.
      required:
        - pointer
        - message
    PageInfo:
      type: object
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: Pass as `cursor` to get the next page; null on the last page.
        has_more:
          type: boolean
        total:
          type:
            - integer
            - "null"
          description: Only with `include_total=true`.
      required:
        - next_cursor
        - has_more
    Money:
      type: object
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units (cents).
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217.
      required:
        - amount_minor
        - currency
    CustomData:
      type: object
      additionalProperties: true
      description: Custom field values keyed by `custom_field_def.key`; validated against the definitions.
    Address:
      type: object
      properties:
        line1:
          type:
            - string
            - "null"
        line2:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        region:
          type:
            - string
            - "null"
        postal_code:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
          description: ISO 3166-1 alpha-2.
    AssignmentTarget:
      type: object
      description: "Exactly one target: a person, a location, or another asset."
      properties:
        person_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        target_asset_id:
          type: string
          format: uuid
      oneOf:
        - required:
            - person_id
        - required:
