          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: model_id
          in: query
          description: Any of these models.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: manufacturer_id
          in: query
          description: Via the model.
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          description: Assets at this location.
          schema:
            type: string
            format: uuid
        - name: include_sublocations
          in: query
          description: "With `location_id`: include the whole subtree."
          schema:
            type: boolean
            default: true
        - name: company_id
          in: query
          description: Filter by company.
          schema:
            type: string
            format: uuid
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            type: string
            format: uuid
        - name: parent_asset_id
          in: query
          description: Children of this asset.
          schema:
            type: string
            format: uuid
        - name: assigned_person_id
          in: query
          description: Currently checked out to this person.
          schema:
            type: string
            format: uuid
        - name: assigned
          in: query
          description: true = checked out, false = in stock.
          schema:
            type: boolean
        - name: loaner_pool_id
          in: query
          description: Members of this loaner pool.
          schema:
            type: string
            format: uuid
        - name: warranty_end_before
          in: query
          description: Warranty ends on or before.
          schema:
            type: string
            format: date
        - name: warranty_end_after
          in: query
          description: Warranty ends on or after.
          schema:
            type: string
            format: date
        - name: purchase_date_from
          in: query
          description: Purchased on or after.
          schema:
            type: string
            format: date
        - name: purchase_date_to
          in: query
          description: Purchased on or before.
          schema:
            type: string
            format: date
        - name: updated_since
          in: query
          description: Changed at or after (incremental sync).
          schema:
            type: string
            format: date-time
        - name: cf
          in: query
          style: deepObject
          explode: true
          description: Custom field filters, e.g. `cf[warranty_tier]=gold`. Exact match on the JSONB value.
          schema:
            type: object
            additionalProperties:
              type: string
        - name: expand
          in: query
          description: Embed related objects under `expanded`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - model
                - category
                - location
                - vendor
        - name: fields
          in: query
          description: "Sparse fieldset: return only these top-level properties (`id` is always included)."
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          style: form
          explode: false
          description: "Comma-separated sort keys, `-` prefix = descending. Allowed: created_at, updated_at, asset_tag, name, purchase_date, warranty_end. A unique tiebreaker (`id`) is always appended."
          schema:
            type: array
            items:
              type: string
              enum:
                - created_at
                - -created_at
                - updated_at
                - -updated_at
                - asset_tag
                - -asset_tag
                - name
                - -name
                - purchase_date
                - -purchase_date
                - warranty_end
                - -warranty_end
            default:
              - -created_at
