packages:
  - apps/*
  - packages/*

# Needed by `pnpm deploy` (apps/api/Dockerfile) so workspace packages are copied, not symlinked.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': false
  prisma: true
  # msw's postinstall only prints a notice (we copy the service worker ourselves).
  msw: false

injectWorkspacePackages: true

# Security overrides (scripts/ci/audit.mjs). Remove each one once the parent package ships the fix itself.
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS in Schema.TemplateLiteral), fixed in effect 3.22.1. prisma 7.10.1, the latest
  # stable release, still pins effect 3.20.0 through @prisma/config.
  '@prisma/config>effect': 3.22.4

minimumReleaseAgeExclude:
  - '@nestjs/common@12.5.1'
  - '@nestjs/core@12.5.1'
  - '@nestjs/platform-fastify@12.5.1'
  - '@nestjs/testing@12.5.1'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - nestjs-pino@5.3.2
  - typescript-eslint@8.73.0
